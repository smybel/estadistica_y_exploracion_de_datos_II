{n:1,eje:1,short:'Parámetro y estimador',title:'Parámetro, estimador e insesgadez',
lead:'La distinción con la que empieza toda la inferencia: lo que quiero saber y lo que puedo calcular.',
html:`${MINI([['Parámetro','Característica de <b>toda la población</b>. Es un valor fijo, aunque casi siempre desconocido. Se escribe con letras griegas: μ, σ, p.'],['Estimador','Una regla calculada con <b>una muestra</b> para aproximar el parámetro. Cambia de muestra en muestra. Ejemplos: x̄, s, p̂.']])}
<p>${EJ}La altura media real de 10.000 estudiantes es μ. Medimos a 100 y calculamos su media x̄ para estimarla. Si tomáramos otros 100, x̄ daría otro valor; μ seguiría siendo el mismo.</p>
${T(['','Población (parámetro)','Muestra (estimador)'],[['Media','μ','x̄'],['Desviación estándar','σ','s'],['Proporción','p','p̂'],['Tamaño','N','n']])}
${D('La <b>distribución muestral</b> es la distribución de un estadístico (como x̄) calculado en todas las muestras posibles de tamaño n de una misma población.')}
<h3>Estimador insesgado</h3>
${F('E(θ̂) = θ')}
<p>Un estimador es <b>insesgado</b> cuando su valor esperado coincide con el parámetro: si repitiéramos el muestreo muchas veces, sus estimaciones promediarían el valor real. No tiende a equivocarse siempre hacia el mismo lado.</p>
${TRAP('Pensar que insesgado significa "sin error". Cada muestra puede dar un valor por encima o por debajo; lo que no hay es un desvío sistemático.')}
<p><b>Estimación puntual</b> es dar un solo valor (x̄ = 172 cm). <b>Estimación por intervalo</b> es dar un rango con un nivel de confianza.</p>`,
coloquio:'Un parámetro es una característica fija, aunque generalmente desconocida, de toda la población, como su media μ. Un estimador es una fórmula calculada con una muestra, como la media muestral, para aproximarlo. Es insesgado si su valor esperado coincide con el parámetro.',
links:[2,3],
quiz:[Q('Si tomo otra muestra de la misma población, ¿qué cambia?',['El parámetro','La estimación','Ambos','Ninguno'],1,'El parámetro es fijo; la estimación varía entre muestras.'),
Q('¿Cuál de estos es un parámetro?',['x̄','s','μ','p̂'],2,'μ describe a toda la población.'),
Q('Un estimador insesgado es aquel que…',['Nunca se equivoca','En promedio acierta el parámetro','Tiene varianza cero','Usa toda la población'],1,'E(estimador) = parámetro; cada muestra puede tener error.')]},

{n:2,eje:1,short:'TLC y error estándar',title:'Teorema Central del Límite y error estándar',
lead:'Por qué la normal aparece en todos lados y cuánto se puede confiar en un promedio.',
html:`${D('El <b>Teorema Central del Límite</b> dice que, con muestras suficientemente grandes (regla práctica: n ≥ 30), la distribución de la media muestral se aproxima a una normal, <b>aunque la población original no sea normal</b>.')}
${F(`x̄ ≈ Normal( μ , ${FR('σ','√n')} )`)}
${W('tlc')}
<p>Condiciones del caso clásico: observaciones independientes y varianza finita. Los datos originales no necesitan ser normales.</p>
<h3>Error estándar</h3>
${D('El <b>error estándar (EE)</b> es la desviación estándar de la distribución muestral. Mide cuánto varía un estimador de muestra en muestra: es la incertidumbre de la estimación.')}
${F(`EE(x̄) = ${FR('σ','√n')} ≈ ${FR('s','√n')} &nbsp;&nbsp;&nbsp; EE(p̂) = √ ${FR('p(1 − p)','n')}`)}
<p><b>Efecto de n:</b> al aumentar el tamaño de muestra, el error estándar baja, pero con la raíz cuadrada. Para reducirlo a la mitad hay que <b>cuadruplicar</b> n.</p>
<p>${EJ}Con σ = 20: si n = 25, EE = 20/5 = 4. Si n = 100, EE = 20/10 = 2.</p>
${TRAP('Confundir desviación estándar con error estándar. La desviación estándar describe cuánto varían los datos individuales; el error estándar, cuánto varía la media entre muestras.')}
<p><b>Corrección por población finita:</b> si se muestrea sin reemplazo y la muestra supera el 5 % de la población, el EE se multiplica por √[(N − n) / (N − 1)], que lo reduce.</p>`,
coloquio:'El Teorema Central del Límite dice que, con muestras suficientemente grandes, la distribución de la media muestral se aproxima a una normal aunque la población no lo sea. El error estándar es sigma sobre raíz de n: baja al aumentar la muestra, y para reducirlo a la mitad hay que cuadruplicar n.',
links:[1,3,5],
quiz:[Q('Con σ = 30 y n = 36, ¿cuánto vale el error estándar de la media?',['30','6','5','0,83'],2,'30 / √36 = 30 / 6 = 5.'),
Q('Para reducir el error estándar a la mitad hay que…',['Duplicar n','Cuadruplicar n','Reducir n a la mitad','Aumentar σ'],1,'El EE depende de 1/√n.'),
Q('El TLC exige que la población original sea normal.',['Verdadero','Falso'],1,'Justamente vale aunque no lo sea, con n suficientemente grande.')]},

{n:3,eje:1,short:'Intervalos de confianza y t',title:'Intervalos de confianza y distribución t de Student',
lead:'Dar un rango en lugar de un número, y saber qué significa de verdad "95 % de confianza".',
html:`${F('Intervalo = Estimador ± Valor crítico × Error estándar')}
<p>El término que se suma y se resta es el <b>margen de error</b>.</p>
<h3>Qué significa el nivel de confianza (1 − α)</h3>
<p>Un 95 % de confianza significa que, si repitiéramos el muestreo muchas veces y construyéramos un intervalo cada vez, <b>alrededor del 95 % de esos intervalos contendrían el parámetro verdadero</b>. La confianza está en el procedimiento.</p>
${W('ic')}
${TRAP('Decir "hay 95 % de probabilidad de que μ esté en este intervalo". El parámetro es fijo: no tiene probabilidad. Lo que varía es el intervalo. α = 0,05 es el 5 % de intervalos que, a la larga, no lo contienen.')}
<h3>¿Z o t de Student?</h3>
${T(['','Normal Z','t de Student'],[['Se usa cuando','σ poblacional conocida, o n grande','σ desconocida: se estima con s'],['Típicamente','Muestras grandes','Muestras chicas y datos aproximadamente normales'],['Forma','Fija','Colas más pesadas; depende de los grados de libertad (n − 1)'],['Efecto','Intervalo más angosto','Intervalo más ancho: paga la incertidumbre de estimar σ']])}
${W('tz')}
<p>${EJ}Con 12 mediciones y σ desconocida se usa t con 11 grados de libertad. A medida que n crece, t se parece cada vez más a Z.</p>`,
coloquio:'Un 95 % de confianza significa que, si repitiéramos el muestreo muchas veces, alrededor del 95 % de los intervalos construidos contendrían el parámetro verdadero; no es una probabilidad del parámetro. Uso t de Student cuando desconozco la desviación poblacional y la estimo con la muestra, sobre todo con muestras chicas.',
links:[2,4,6],
quiz:[Q('¿Qué pasa con el intervalo si subo la confianza de 95 % a 99 %?',['Se angosta','Se ensancha','No cambia','Desaparece el error'],1,'Más confianza exige un valor crítico mayor.'),
Q('Tengo n = 10 y no conozco σ. ¿Qué distribución uso para la media?',['Z','t con 9 grados de libertad','t con 10 grados de libertad','Binomial'],1,'gl = n − 1.'),
Q('La interpretación correcta de un IC del 95 % es…',['El 95 % de los datos está en el intervalo','Hay 95 % de probabilidad de que μ cambie','El 95 % de los intervalos así construidos contendría a μ','La muestra representa al 95 % de la población'],2,'La confianza se refiere al procedimiento repetido.')]},

{n:4,eje:1,short:'Proporciones y tamaño de muestra',title:'Proporciones y tamaño de muestra',
lead:'Cuánta gente hay que encuestar y cuándo se puede usar la normal para una proporción.',
html:`<h3>Aproximar una proporción por una normal</h3>
<p>La proporción muestral p̂ se puede tratar como normal si se cumplen dos condiciones:</p>
${L(['Observaciones <b>independientes</b> (muestreo adecuado).','Suficientes <b>éxitos y fracasos esperados</b>. Regla habitual: n·p ≥ 10 y n·(1 − p) ≥ 10. Algunos textos, y el resumen de la cátedra, usan el criterio ≥ 5.'])}
<p>${EJ}Con n = 200 y p = 0,2: n·p = 40 y n·(1 − p) = 160. La aproximación es razonable. Con eventos muy raros hace falta una muestra mucho mayor o métodos exactos.</p>
<h3>Tamaño de muestra para una proporción</h3>
${F(`n ≈ ${FR('z² · p(1 − p)','E²')}`)}
<p>E es el margen de error deseado y z el valor crítico (1,96 para 95 %).</p>
<h3>Por qué p = 0,50 cuando no hay información previa</h3>
<p>El producto p(1 − p) es la variabilidad de una proporción y alcanza su máximo en p = 0,5. Usar ese valor da el tamaño de muestra <b>más grande</b> posible, o sea el más conservador: pase lo que pase, la muestra alcanza.</p>
${W('muestra')}
<p>Si se eligiera p = 0,1 sin evidencia, se podría subestimar la variabilidad y quedarse corto de muestra.</p>`,
coloquio:'Se usa p igual a 0,50 porque maximiza el producto p por uno menos p, que es la variabilidad de una proporción: así obtengo el tamaño de muestra más conservador. Para aproximar una proporción por una normal necesito observaciones independientes y al menos diez éxitos y diez fracasos esperados.',
links:[2,3,19],
quiz:[Q('¿En qué valor de p es máximo p(1 − p)?',['0,1','0,25','0,5','1'],2,'Vale 0,25, su máximo.'),
Q('Con n = 50 y p = 0,04, ¿se puede aproximar por una normal?',['Sí','No, porque n·p = 2 es muy chico','Sí, porque n ≥ 30','No, porque p < 0,5'],1,'Se necesitan suficientes éxitos esperados.'),
Q('Si quiero la mitad de margen de error, el tamaño de muestra debe…',['Duplicarse','Cuadruplicarse','Bajar a la mitad','Quedar igual'],1,'E está al cuadrado en el denominador.')]},

{n:5,eje:2,short:'Lógica de una prueba de hipótesis',title:'La lógica de las pruebas de hipótesis',
lead:'El razonamiento que comparten todas las pruebas del módulo. Si esto está claro, el resto son variantes.',
html:`${MINI([['Hipótesis nula (H₀)','Sostiene la igualdad, la ausencia de efecto, el statu quo. Es la que se somete a prueba.'],['Hipótesis alternativa (H₁)','Es la afirmación del investigador: hay diferencia, es mayor o es menor.']])}
${FLOW([['Plantear','H₀ y H₁'],['Fijar α','antes de mirar los datos'],['Calcular','el estadístico de prueba'],['Obtener','el p-valor'],['Decidir','p ≤ α: se rechaza H₀']])}
${D('El <b>p-valor</b> es la probabilidad de observar un resultado tan extremo o más que el obtenido, <b>suponiendo que H₀ es verdadera</b>. Si p ≤ α, se rechaza H₀.')}
${D('El <b>nivel de significación α</b> es la probabilidad máxima que se tolera de cometer un error de tipo I. Se fija de antemano, habitualmente en 0,05.')}
<h3>Los dos errores posibles</h3>
${T(['','H₀ es verdadera','H₀ es falsa'],[['Rechazo H₀','<b>Error tipo I</b> (falso positivo). Probabilidad α','Decisión correcta. Potencia = 1 − β'],['No rechazo H₀','Decisión correcta','<b>Error tipo II</b> (falso negativo). Probabilidad β']])}
${W('sortErr')}
<p><b>Potencia estadística (1 − β):</b> probabilidad de detectar un efecto que realmente existe. Con n fijo hay un compromiso inevitable: bajar α hace subir β. La forma de bajar los dos es aumentar la muestra.</p>
${TRAP('Decir "se acepta H₀" o "p > 0,05 demuestra que H₀ es verdadera". Solo significa que no hay evidencia suficiente para rechazarla. Y el p-valor no es la probabilidad de que H₀ sea cierta.')}
${TRAP('Confundir significancia estadística con importancia práctica. Con muestras enormes, una diferencia minúscula da p < 0,05.')}`,
coloquio:'La hipótesis nula sostiene que no hay efecto y es la que se pone a prueba; la alternativa es lo que quiere mostrar el investigador. El p-valor es la probabilidad de un resultado tan extremo como el observado si la nula fuera cierta: si es menor o igual que alfa, la rechazo. Error tipo I es rechazar una nula verdadera; tipo II, no rechazar una falsa.',
links:[3,6,8,16],
quiz:[Q('Obtengo p = 0,03 con α = 0,05. ¿Qué decido?',['No rechazo H₀','Rechazo H₀','Acepto H₀ como verdadera','Repito hasta que dé otra cosa'],1,'p ≤ α.'),
Q('El error de tipo I es…',['No rechazar H₀ siendo falsa','Rechazar H₀ siendo verdadera','Usar una muestra chica','Calcular mal el p-valor'],1,'Es el falso positivo, con probabilidad α.'),
Q('La potencia de una prueba es…',['α','β','1 − β','1 − α'],2,'Probabilidad de rechazar H₀ cuando es falsa.'),
Q('Verdadero o falso: p = 0,40 demuestra que H₀ es verdadera.',['Verdadero','Falso'],1,'Solo indica evidencia insuficiente contra H₀.')]},

{n:6,eje:2,short:'Prueba t: señal y ruido',title:'El estadístico t, muestras independientes y pareadas',
lead:'La prueba más usada, entendida como una división: cuánto efecto hay por cada unidad de incertidumbre.',
html:`${F(`t = ${FR('Señal','Ruido')} = ${FR('estimación − valor bajo H₀','error estándar')}`)}
<p>El estadístico <b>t</b> mide <b>cuántos errores estándar</b> separan lo observado de lo que plantea H₀. En una muestra: t = (x̄ − μ₀) / (s / √n), con n − 1 grados de libertad.</p>
<p>${EJ}x̄ = 52, μ₀ = 50, s = 10, n = 100. EE = 10/√100 = 1, así que t = (52 − 50)/1 = 2.</p>
${W('tstat')}
${TRAP('Creer que un t grande implica un efecto importante. Un efecto chico con una muestra enorme también da un t grande, porque el ruido se achica.')}
<h3>Muestras independientes o pareadas</h3>
${MINI([['Independientes','Dos grupos formados por individuos distintos. Ejemplo: grupo control contra grupo tratamiento. Señal: x̄₁ − x̄₂.'],['Pareadas','Al mismo individuo se lo mide dos veces. Ejemplo: antes y después. Se trabaja con la diferencia de cada sujeto, lo que cancela el ruido individual y da más potencia.']])}
<h3>Cuando no hay normalidad: Mann-Whitney U</h3>
${D('La prueba de <b>Mann-Whitney U</b> es la alternativa <b>no paramétrica</b> a la t para dos muestras independientes. Trabaja con los <b>rangos</b> (el orden de los datos) en lugar de las medias.')}
<p>${EJ}Comparar los tiempos de espera, muy asimétricos, de dos sucursales. Ojo: compara distribuciones, y solo equivale a comparar medianas si las dos distribuciones tienen la misma forma.</p>
${W('sortTest')}`,
coloquio:'El estadístico t mide cuántos errores estándar separan la diferencia observada de la planteada por la hipótesis nula: es señal sobre ruido. En una muestra es la media menos mu cero, dividido s sobre raíz de n. Si no se cumple la normalidad con dos muestras independientes, uso Mann-Whitney U, que trabaja con rangos.',
links:[5,7,8],
quiz:[Q('x̄ = 105, μ₀ = 100, s = 20, n = 64. ¿Cuánto vale t?',['0,25','2','5','2,5'],1,'EE = 20/8 = 2,5; t = 5/2,5 = 2.'),
Q('Medir la presión de los mismos pacientes antes y después de un tratamiento es un diseño de muestras…',['Independientes','Pareadas','Aleatorias simples','No paramétricas'],1,'Cada sujeto es su propio control.'),
Q('¿Qué prueba reemplaza a la t para dos muestras independientes sin normalidad?',['ANOVA','Tukey','Mann-Whitney U','Levene'],2,'Es no paramétrica y usa rangos.')]},

{n:7,eje:2,short:'Normalidad y Q-Q plot',title:'Pruebas de normalidad y Q-Q plot',
lead:'Muchas pruebas suponen normalidad. Cómo se verifica y por qué el gráfico pesa tanto como el p-valor.',
html:`<h3>Shapiro-Wilk y Kolmogorov-Smirnov</h3>
${MINI([['H₀','Los datos provienen de una distribución normal.'],['H₁','Los datos no provienen de una distribución normal.']])}
<p>Shapiro-Wilk contrasta específicamente normalidad. Kolmogorov-Smirnov compara los datos con una distribución especificada (que puede ser la normal).</p>
<p><b>Atención al sentido:</b> acá un p-valor <b>chico</b> es la mala noticia. p ≤ 0,05 → se rechaza la normalidad. p > 0,05 → no hay evidencia contra la normalidad (lo que no la demuestra).</p>
<h3>La trampa de las muestras grandes</h3>
<p>Con muestras muy grandes (miles de datos), la prueba tiene tanta potencia que detecta desviaciones <b>minúsculas e irrelevantes</b> y devuelve p ≤ 0,05 igual. Se la llama paradoja del poder o trampa del big data. Por eso el p-valor se complementa siempre con gráficos y con el contexto.</p>
<h3>Q-Q plot</h3>
${D('El <b>Q-Q plot</b> compara los cuantiles observados con los cuantiles teóricos de una normal. Si los puntos siguen aproximadamente la diagonal, los datos son compatibles con la normalidad.')}
${W('qq')}
<p><b>Su ventaja sobre las pruebas formales:</b> no da solo un sí o un no. Muestra <b>cómo</b> y <b>dónde</b> se apartan los datos (asimetría, colas pesadas, valores extremos) y permite juzgar si el desvío importa.</p>`,
coloquio:'En Shapiro-Wilk la hipótesis nula dice que los datos siguen una distribución normal y la alternativa que no. Con muestras muy grandes la prueba detecta desviaciones mínimas y da p-valores chicos aunque no importen en la práctica; por eso se complementa con el Q-Q plot, donde los puntos deben seguir la diagonal.',
links:[5,8,11],
quiz:[Q('En Shapiro-Wilk obtengo p = 0,02 (α = 0,05). ¿Qué concluyo?',['Los datos son normales','Hay evidencia de que no son normales','La muestra es chica','No se puede concluir nada'],1,'Se rechaza H₀: normalidad.'),
Q('¿Por qué puede engañar una prueba de normalidad con n = 20.000?',['Porque nunca rechaza','Porque detecta desviaciones irrelevantes y rechaza igual','Porque no se puede calcular','Porque exige varianzas iguales'],1,'Demasiada potencia: todo desvío resulta "significativo".'),
Q('En un Q-Q plot de datos normales, los puntos…',['Forman una U','Siguen la diagonal','Forman un embudo','Quedan horizontales'],1,'Cuantiles observados ≈ cuantiles teóricos.')]},

{n:8,eje:2,short:'ANOVA, Levene y Tukey',title:'ANOVA: comparar tres o más medias',
lead:'Por qué no se hacen muchas pruebas t, qué hace el ANOVA y qué viene antes y después.',
html:`<h3>La trampa de la multiplicidad</h3>
<p>Cada prueba t al 5 % tiene un 5 % de riesgo de falso positivo. Si se hacen muchas, la probabilidad de que <b>al menos una</b> dé un falso positivo (la tasa de error familiar) se dispara:</p>
${F('Error familiar = 1 − (1 − α)<sup>m</sup>')}
${W('fwer')}
<h3>ANOVA ómnibus</h3>
${D('El <b>ANOVA de un factor</b> contrasta con <b>una sola prueba</b> si todas las medias poblacionales son iguales. H₀: μ₁ = μ₂ = … = μₖ. H₁: al menos una difiere.')}
${F(`F = ${FR('MS entre grupos','MS dentro de los grupos')}`)}
<p>Otra vez señal sobre ruido: cuánto se separan las medias entre sí, comparado con cuánto varían los datos dentro de cada grupo.</p>
${W('anova')}
${TRAP('Creer que un ANOVA significativo dice cuáles grupos son distintos. Solo dice que al menos uno difiere. Por eso se llama "ómnibus".')}
<h3>El recorrido completo</h3>
${FLOW([['Levene','¿varianzas iguales?'],['ANOVA clásico','si Levene no rechaza'],['Welch','si Levene rechaza'],['Tukey HSD','solo si F es significativo']])}
${L(['<b>Prueba de Levene:</b> evalúa la <b>homocedasticidad</b>. H₀: las varianzas de los grupos son iguales. Si p < 0,05, se viola el supuesto.','<b>ANOVA de Welch:</b> alternativa paramétrica cuando las varianzas difieren. Ajusta los grados de libertad y no requiere varianzas iguales.','<b>Tukey HSD:</b> prueba <b>post-hoc</b>. Compara todos los pares de medias y dice cuáles difieren, manteniendo el error familiar en α.'])}`,
coloquio:'Al hacer muchas pruebas t aumenta la probabilidad de obtener al menos un falso positivo. Por eso para tres o más medias se usa ANOVA, que contrasta si todas son iguales con una sola prueba F. Antes verifico varianzas iguales con Levene; si falla uso Welch. Si el ANOVA es significativo, Tukey identifica qué pares difieren.',
links:[5,6,7],
quiz:[Q('¿Cuántas comparaciones de a pares hay entre 4 grupos?',['3','4','6','8'],2,'k(k − 1)/2 = 4·3/2 = 6.'),
Q('Levene da p = 0,01. ¿Qué corresponde?',['ANOVA clásico','ANOVA de Welch','Tukey directamente','Shapiro-Wilk'],1,'Se rechazó la igualdad de varianzas.'),
Q('¿Cuándo se aplica Tukey HSD?',['Antes del ANOVA','Solo si el ANOVA fue significativo','En lugar de Levene','Cuando hay dos grupos'],1,'Es una prueba post-hoc.'),
Q('Un ANOVA significativo indica que…',['Todas las medias son distintas','Al menos una media difiere','Las varianzas son iguales','Los datos son normales'],1,'No dice cuál.')]},

{n:9,eje:3,short:'Correlación y regresión',title:'Correlación y regresión: diferencias y coeficiente de Pearson',
lead:'Dos herramientas parecidas con preguntas distintas. Y la advertencia de siempre sobre la causalidad.',
html:`${T(['','Correlación','Regresión'],[['Pregunta','¿Qué tan fuerte y en qué dirección se asocian?','¿Cómo cambia Y cuando cambia X?'],['Roles de las variables','Simétricos: no distingue explicativa de respuesta','Asimétricos: X explica, Y responde'],['Resultado','Un número: r','Una ecuación: ŷ = β₀ + β₁x'],['Sirve para','Describir la asociación','Explicar y predecir']])}
${TRAP('Correlación no implica causalidad, y la regresión tampoco la prueba por sí sola. Puede haber una tercera variable detrás de las dos.')}
<h3>Coeficiente de correlación de Pearson</h3>
${D('<b>r</b> mide la fuerza y la dirección de la asociación <b>lineal</b> entre dos variables cuantitativas. Varía entre −1 y +1.')}
${W('corr')}
${T(['Valor de r','Lectura'],[['Cerca de +1','Asociación lineal positiva fuerte'],['Cerca de −1','Asociación lineal negativa fuerte'],['Cerca de 0','Poca o ninguna asociación <b>lineal</b>']])}
<p>${EJ}r = −0,9 entre precio y demanda: cuando el precio sube, la demanda baja, y de forma muy consistente.</p>
<p><b>r = 0 no significa "sin relación":</b> puede existir una relación curva perfecta (en forma de U) con r = 0. En regresión lineal simple, R² = r².</p>`,
coloquio:'La correlación cuantifica la fuerza y la dirección de una asociación sin distinguir variable explicativa y respuesta; la regresión modela una respuesta en función de predictores para explicar o predecir. Ninguna prueba causalidad. Pearson mide asociación lineal y va de menos uno a uno.',
links:[10,11,12],
quiz:[Q('¿Entre qué valores varía r?',['0 y 1','−1 y 1','−∞ y +∞','0 y 100'],1,'−1 ≤ r ≤ 1.'),
Q('r = 0 significa que…',['No hay ninguna relación','No hay relación lineal','Hay relación perfecta','Hay causalidad'],1,'Puede haber una relación curva.'),
Q('¿Cuál de las dos distingue entre variable explicativa y respuesta?',['La correlación','La regresión','Ambas','Ninguna'],1,'La correlación es simétrica.')]},

{n:10,eje:3,short:'La recta de regresión',title:'La recta: pendiente, intercepto y mínimos cuadrados',
lead:'Cómo se lee cada parte de ŷ = β₀ + β₁x y con qué criterio se elige la recta.',
html:`${F('ŷ = β₀ + β₁x')}
${MINI([['Pendiente β₁','Cuánto cambia el valor esperado de Y cuando X aumenta <b>una unidad</b>. Geométricamente es la inclinación de la recta: positiva si sube, negativa si baja.'],['Intercepto β₀','El valor predicho de Y cuando X = 0. Es donde la recta corta al eje vertical.']])}
<p>${EJ}ŷ = 5 + 2x, con x = horas de estudio. Por cada hora extra, la nota predicha sube 2 puntos. Con cero horas, la nota predicha es 5.</p>
<h3>Cuándo tiene sentido el intercepto</h3>
<p>Solo si X = 0 es un valor <b>posible y relevante</b> dentro del rango observado. Si los datos van de 150 a 190 cm de altura, el intercepto (el peso predicho para una persona de 0 cm) es una extrapolación sin sentido: queda como un parámetro matemático que ubica la recta.</p>
<h3>Mínimos Cuadrados Ordinarios (OLS / MCO)</h3>
${D('OLS elige los coeficientes que <b>minimizan la suma de los residuos al cuadrado</b>: la suma de (yᵢ − ŷᵢ)².')}
${W('recta')}
<p><b>¿Por qué al cuadrado?</b> Para que los errores positivos y negativos no se cancelen, y para penalizar más los errores grandes.</p>
<p>${EJ}Valores reales 4 y 8, predicciones 5 y 6. Errores: −1 y +2. Suma de cuadrados: 1 + 4 = 5.</p>`,
coloquio:'La pendiente beta uno indica cuánto cambia el valor esperado de Y cuando X aumenta una unidad; es la inclinación de la recta. El intercepto es el valor predicho cuando X vale cero y solo tiene sentido práctico si cero es un valor posible. Mínimos cuadrados elige los coeficientes que minimizan la suma de los residuos al cuadrado.',
links:[9,11,12],
quiz:[Q('En ŷ = 12 − 3x, al aumentar x en 1 la predicción…',['Sube 3','Baja 3','Sube 12','No cambia'],1,'La pendiente es −3.'),
Q('¿Cuándo el intercepto tiene interpretación práctica?',['Siempre','Cuando X = 0 es posible y relevante','Nunca','Cuando es positivo'],1,'Si no, es una extrapolación.'),
Q('OLS minimiza…',['La suma de los residuos','La suma de los residuos al cuadrado','El valor de r','La pendiente'],1,'Σ(yᵢ − ŷᵢ)².')]},

{n:11,eje:3,short:'R², residuos y homocedasticidad',title:'R², residuos y homocedasticidad',
lead:'Qué tan bien ajusta la recta y cómo saber si el modelo es confiable mirando sus errores.',
html:`<h3>Coeficiente de determinación</h3>
${F(`R² = 1 − ${FR('SSE','SST')}`)}
${D('<b>R²</b> mide qué proporción de la variabilidad de Y explica el modelo, comparado con predecir siempre la media.')}
<p><b>R² = 0,81</b> significa que el modelo explica el <b>81 % de la variabilidad</b> de Y en esos datos. No significa 81 % de aciertos ni demuestra causalidad. Fuera de la muestra, R² puede ser negativo si el modelo predice peor que la media.</p>
<h3>Residuos</h3>
${F('eᵢ = yᵢ − ŷᵢ')}
<p>El <b>residuo</b> es la diferencia entre el valor observado y el predicho. ${EJ}Venta real 120, predicción 110: residuo +10.</p>
<p><b>Papel en el diagnóstico:</b> analizar sus patrones permite detectar no linealidad, varianza desigual y observaciones extremas. Lo que se espera es una nube sin forma, centrada en cero.</p>
${W('residuos')}
<h3>Homocedasticidad</h3>
${D('<b>Homocedasticidad:</b> la varianza de los errores es <b>constante</b> para todos los valores de los predictores. Var(ε | X) = σ².')}
<p>Si la dispersión crece o decrece (forma de embudo), hay <b>heterocedasticidad</b>: los errores estándar y las pruebas clásicas dejan de ser confiables. ${EJ}Los errores al predecir ventas son mucho más dispersos en las tiendas grandes.</p>`,
coloquio:'R cuadrado mide la proporción de variabilidad de Y explicada por el modelo respecto de la media: 0,81 significa que explica el 81 %. Un residuo es la diferencia entre el valor observado y el predicho, y sus patrones ayudan a detectar problemas. Homocedasticidad es que la varianza de los errores sea constante.',
links:[9,10,12,7],
quiz:[Q('R² = 0,81 significa que el modelo…',['Acierta el 81 % de las predicciones','Explica el 81 % de la variabilidad de Y','Tiene r = 0,81','Demuestra causalidad'],1,'Es proporción de varianza explicada.'),
Q('Real = 50, predicho = 58. ¿Cuánto vale el residuo?',['8','−8','108','0'],1,'e = y − ŷ = 50 − 58.'),
Q('Un gráfico de residuos en forma de embudo sugiere…',['Homocedasticidad','Heterocedasticidad','Normalidad','Buen ajuste'],1,'La varianza del error no es constante.')]},

{n:12,eje:3,short:'Regresión múltiple',title:'Regresión múltiple: R² ajustado y multicolinealidad',
lead:'Con varios predictores aparecen dos problemas nuevos: inflar el R² y repetir información.',
html:`<h3>R² ajustado</h3>
<p>El R² convencional <b>nunca baja</b> al agregar una variable, aunque sea completamente inútil. Así, sumar predictores siempre "mejora" el modelo en apariencia.</p>
${F(`R² ajustado = 1 − (1 − R²) · ${FR('n − 1','n − k − 1')}`)}
<p>El <b>R² ajustado</b> penaliza la cantidad de predictores (k). Solo sube si la variable nueva aporta más de lo que cuesta, y puede bajar. Por eso permite comparar de forma justa modelos con distinta cantidad de variables.</p>
<p>${EJ}Agregar una variable aleatoria sube R² de 0,800 a 0,801, pero el R² ajustado baja.</p>
<h3>Multicolinealidad</h3>
${D('Hay <b>multicolinealidad</b> cuando dos o más predictores están fuertemente relacionados entre sí.')}
<p><b>Efecto negativo:</b> los coeficientes se vuelven inestables y sus errores estándar aumentan, por lo que ya no se puede interpretar el efecto individual de cada variable.</p>
<p>${EJ}Usar ingreso mensual e ingreso anual en el mismo modelo: son casi la misma información.</p>
${F(`VIF = ${FR('1','1 − Rⱼ²')}`)}
<p>El <b>VIF</b> (factor de inflación de la varianza) la detecta: valores altos indican problema. <b>Soluciones:</b> quitar o combinar predictores redundantes, o usar regularización.</p>
<h3>Regularización</h3>
${T(['','Qué penaliza','Efecto'],[['Ridge (L2)','λ · Σ βⱼ²','Contrae los coeficientes hacia cero sin anularlos. Resuelve multicolinealidad.'],['Lasso (L1)','λ · Σ |βⱼ|','Lleva coeficientes irrelevantes exactamente a cero: selección automática de variables.'],['Elastic Net','Mezcla de L1 y L2','Combina la selección de Lasso con la estabilidad de Ridge.']])}`,
coloquio:'R cuadrado nunca disminuye al agregar predictores, incluso inútiles; el R cuadrado ajustado penaliza incorporar variables y permite comparar modelos de manera más justa. Multicolinealidad es que dos o más predictores estén muy relacionados: vuelve inestables los coeficientes. Se revisa con el VIF y se corrige quitando, combinando o regularizando.',
links:[10,11,15],
quiz:[Q('¿Qué pasa con el R² al agregar una variable inútil?',['Baja','Sube o queda igual','Se vuelve negativo','Vale 1'],1,'Nunca disminuye; por eso se usa el ajustado.'),
Q('¿Qué indicador detecta multicolinealidad?',['VIF','AUC','F1','p-valor de Levene'],0,'Factor de inflación de la varianza.'),
Q('¿Qué regularización hace selección automática de variables?',['Ridge','Lasso','Ninguna','OLS'],1,'Lleva coeficientes a cero.')]},

{n:13,eje:4,short:'De la recta a la sigmoide',title:'Por qué logística: de la recta a la sigmoide',
lead:'Qué falla cuando se usa una recta para predecir un sí o un no, y cómo lo arregla la sigmoide.',
html:`<h3>Por qué OLS no sirve para una respuesta binaria</h3>
${L(['Una recta no tiene límites: puede predecir "probabilidades" de <b>−0,2 o 1,3</b>, que no existen.','Los supuestos del modelo lineal no se cumplen: los errores no son normales ni tienen varianza constante (son heterocedásticos).','El efecto de X sobre una probabilidad no es constante: cerca de 0 y de 1 tiene que frenarse.'])}
<p>Existe el "modelo de probabilidad lineal", pero con esas limitaciones.</p>
<h3>La función sigmoide</h3>
${F(`p = ${FR('1','1 + e<sup>−z</sup>')} &nbsp;&nbsp; con z = β₀ + β₁x₁ + … + βₚxₚ`)}
${D('La <b>sigmoide</b> (o función logística) transforma el predictor lineal z, que puede ser cualquier número real, en una probabilidad acotada entre 0 y 1. Tiene forma de S.')}
${W('sigmoide')}
${T(['z','p'],[['Muy negativo','Se acerca a 0'],['0','0,5'],['2','1 / (1 + e⁻²) ≈ 0,881'],['Muy positivo','Se acerca a 1']])}
${T(['','Regresión lineal (OLS)','Regresión logística (MLE)'],[['Respuesta Y','Continua','Binaria: 0 o 1'],['Salida','Valor esperado','Probabilidad P(Y = 1)'],['Rango','Sin límites','Entre 0 y 1'],['Se ajusta por','Mínimos cuadrados','Máxima verosimilitud'],['β₁ indica','Cambio constante en Y','Cambio en log-odds; e^β₁ es el Odds Ratio']])}`,
coloquio:'OLS no es adecuado para una respuesta binaria porque puede predecir valores menores que cero o mayores que uno, y sus supuestos de error y varianza no se cumplen. La logística usa la función sigmoide, uno sobre uno más e a la menos z, que transforma cualquier número real en una probabilidad entre cero y uno.',
links:[10,14,15],
quiz:[Q('¿Cuál es el problema principal de usar una recta para Y binaria?',['Es muy lenta','Puede predecir valores fuera de 0 y 1','No admite predictores','Siempre da 0,5'],1,'Una probabilidad debe estar entre 0 y 1.'),
Q('¿Cuánto vale la sigmoide en z = 0?',['0','0,25','0,5','1'],2,'1/(1 + 1).'),
Q('Cuando z crece mucho, p…',['Se acerca a 0','Se acerca a 0,5','Se acerca a 1','Supera 1'],2,'Nunca lo supera.')]},

{n:14,eje:4,short:'Odds, logit y Odds Ratio',title:'Odds, logit y Odds Ratio',
lead:'El idioma en el que habla la regresión logística. Es la parte que más se pregunta con números.',
html:`${F(`Odds = ${FR('p','1 − p')} &nbsp;&nbsp;&nbsp; Logit = ln( ${FR('p','1 − p')} ) = β₀ + β₁x`)}
${MINI([['Odds','La probabilidad de que el evento ocurra dividida por la de que no ocurra. Pueden ser mayores que 1. Con p = 0,75: odds = 0,75/0,25 = 3, o "3 a 1".'],['Logit (log-odds)','El logaritmo natural de las odds. Es lo que la regresión logística modela como una combinación lineal de los predictores. Con p = 0,8: odds = 4, logit ≈ 1,386.']])}
${W('odds')}
${TRAP('Decir que odds = 3 es "probabilidad 3". Odds de 3 corresponden a p = 3/4 = 0,75.')}
<h3>Odds Ratio</h3>
${F('OR = e<sup>β₁</sup>')}
${D('El <b>Odds Ratio</b> es el factor por el que se <b>multiplican las odds</b> cuando el predictor aumenta una unidad, manteniendo constantes los demás.')}
${T(['Coeficiente','OR','Lectura'],[['β₁ > 0','> 1','Aumenta las odds: factor de riesgo o incentivo'],['β₁ = 0','= 1','Sin efecto'],['β₁ < 0','< 1','Disminuye las odds: factor de protección']])}
<h3>Los dos ejemplos de la guía</h3>
${MINI([['β₁ = 0,405','OR = e^0,405 ≈ <b>1,50</b>. Por cada unidad más del predictor, las odds se multiplican por 1,5: aumentan 50 %. Si las odds eran 2, pasan a 3.'],['OR = 0,65','Las odds se multiplican por 0,65: <b>disminuyen 35 %</b>. Es un factor de protección si el evento es perjudicial.']])}
<p>Cambio porcentual en las odds = (OR − 1) × 100 %.</p>
${TRAP('Decir que OR = 1,5 es "50 % más de probabilidad". Es 50 % más de <b>odds</b>. Y un OR menor que 1 no siempre es bueno: depende de cuál sea el evento.')}
${W('sortOR')}`,
coloquio:'Las odds son p sobre uno menos p: la probabilidad de que ocurra dividida por la de que no ocurra. El logit es su logaritmo y se modela como combinación lineal de los predictores. El Odds Ratio es e elevado al coeficiente: con beta 0,405 da 1,5, las odds aumentan un 50 % por unidad. Un OR de 0,65 las reduce 35 %: es protector.',
links:[13,15],
quiz:[Q('Si p = 0,8, ¿cuánto valen las odds?',['0,8','1,25','4','8'],2,'0,8 / 0,2 = 4.'),
Q('β₁ = 0,405. ¿Cuál es el Odds Ratio?',['0,405','0,67','1,50','4,05'],2,'e^0,405 ≈ 1,5.'),
Q('Un OR = 0,65 para un evento perjudicial es un factor de…',['Riesgo','Protección','Sin efecto','Confusión'],1,'Reduce las odds en 35 %.'),
Q('¿Cuánto vale el logit cuando p = 0,5?',['0','0,5','1','No existe'],0,'Odds = 1 y ln(1) = 0.')]},

{n:15,eje:4,short:'Efecto marginal y significancia',title:'Efecto marginal, Wald y Pseudo R²',
lead:'Cómo cambia la probabilidad, qué predictores importan y qué tan bien ajusta el modelo completo.',
html:`<h3>El efecto marginal no es constante</h3>
${F(`${FR('∂p','∂x')} = β₁ · p · (1 − p)`)}
<p>En una recta, la pendiente es la misma en todos lados. En la logística, la probabilidad sigue una curva en S, así que el efecto de X sobre p <b>depende de en qué punto de la curva estemos</b>.</p>
${W('sigmoide')}
${L(['El producto p(1 − p) es máximo en <b>p = 0,5</b>, donde vale 0,25.','Por eso la pendiente máxima es <b>β₁ / 4</b>, y ocurre en p = 0,5.','Cerca de 0 o de 1, la curva casi no se mueve.'])}
<p>${EJ}Con β₁ = 2: en p = 0,1 la pendiente es 2 · 0,1 · 0,9 = 0,18; en p = 0,5 es 2/4 = 0,5.</p>
<h3>Significancia de cada coeficiente: prueba de Wald</h3>
${F(`z = ${FR('β̂','EE(β̂)')}`)}
<p>La <b>prueba de Wald</b> evalúa si un coeficiente individual es distinto de cero (H₀: βⱼ = 0), manteniendo constantes los demás. Otra vez señal sobre ruido. ${EJ}β̂ = 0,8 y EE = 0,2 dan z = 4: fuerte evidencia contra β = 0.</p>
<h3>Evaluación global del modelo</h3>
${MINI([['Test de razón de verosimilitud (LLR)','Evalúa si el modelo completo supera al modelo nulo. H₀: todos los coeficientes son cero.'],['Pseudo R² de McFadden','1 − LL del modelo / LL del modelo nulo. Mide la ganancia frente al modelo que solo tiene intercepto.']])}
<p><b>Cómo leer McFadden:</b> va de 0 a 1, pero sus valores son mucho más bajos que los de un R² lineal. Entre <b>0,2 y 0,4</b> ya se considera un ajuste excelente. ${EJ}LL del modelo = −60 y LL nulo = −100 dan 1 − 60/100 = 0,40.</p>
${TRAP('Interpretar el Pseudo R² como "porcentaje de varianza explicada" o como porcentaje de aciertos. No equivale al R² lineal.')}`,
coloquio:'El efecto marginal no es constante porque la probabilidad sigue una sigmoide y no una recta: vale beta uno por p por uno menos p. Es máximo en p igual a 0,5, donde equivale a beta uno sobre cuatro. La prueba de Wald evalúa cada coeficiente, y el Pseudo R cuadrado de McFadden compara el modelo con el nulo: entre 0,2 y 0,4 ya es excelente.',
links:[13,14,16],
quiz:[Q('¿En qué valor de p es máxima la pendiente de la curva logística?',['0','0,25','0,5','1'],2,'Allí p(1 − p) = 0,25.'),
Q('Con β₁ = 2, ¿cuánto vale la pendiente máxima?',['2','1','0,5','0,25'],2,'β₁ / 4.'),
Q('¿Qué prueba evalúa un coeficiente individual en logística?',['Levene','Wald','Tukey','Shapiro-Wilk'],1,'z = β̂ / EE(β̂).'),
Q('Un Pseudo R² de McFadden de 0,30 indica…',['Un ajuste pobre','Un ajuste excelente','30 % de aciertos','Sobreajuste'],1,'Entre 0,2 y 0,4 se considera muy bueno.')]},

{n:16,eje:5,short:'Matriz de confusión y métricas',title:'Matriz de confusión y métricas de clasificación',
lead:'Cuatro casilleros de los que salen todas las métricas. Y por qué el porcentaje de aciertos puede mentir.',
html:`${T(['Sigla','Nombre','El modelo dijo','La realidad era','Es un…'],[['VP','Verdadero positivo','Positivo','Positivo','Acierto: detección'],['VN','Verdadero negativo','Negativo','Negativo','Acierto'],['FP','Falso positivo','Positivo','Negativo','Error tipo I: falsa alarma'],['FN','Falso negativo','Negativo','Positivo','Error tipo II: omisión']])}
<p>${EJ}Filtro de spam. FP: un correo legítimo bloqueado. FN: un spam que llega a la bandeja de entrada.</p>
${W('matriz')}
${T(['Métrica','Fórmula','Qué mide'],[['Accuracy (exactitud)','(VP + VN) / Total','Proporción total de aciertos'],['Sensibilidad / Recall / TPR','VP / (VP + FN)','De los positivos reales, cuántos detecté. Busca minimizar los <b>falsos negativos</b>'],['Especificidad / TNR','VN / (VN + FP)','De los negativos reales, cuántos reconocí'],['Tasa de falsos positivos (FPR)','FP / (FP + VN) = 1 − Especificidad','De los negativos reales, cuántos generaron falsa alarma'],['Precisión / PPV','VP / (VP + FP)','De mis alertas, cuántas eran reales'],['F1-Score','2 · P · R / (P + R)','Media armónica de Precisión y Recall']])}
<h3>Por qué la Accuracy engaña con desbalance</h3>
<p>Si 950 de 1.000 clientes pagan, un modelo que predice siempre "paga" tiene Accuracy 95 % y Recall 0 % para los incumplidores: no detecta ni uno.</p>
<h3>Por qué F1 usa la media armónica</h3>
<p>Porque castiga el desequilibrio. Con Precisión 0,9 y Recall 0,1, el promedio simple da 0,5, pero F1 = 2 · 0,09 / 1 = 0,18. Exige que las dos sean buenas. F1 no usa los VN.</p>`,
coloquio:'VP: predijo positivo y era positivo. VN: predijo negativo y era negativo. FP: predijo positivo pero era negativo. FN: predijo negativo pero era positivo. Recall es VP sobre VP más FN y busca minimizar falsos negativos; especificidad es VN sobre VN más FP, y es uno menos la tasa de falsos positivos. Accuracy engaña si una clase domina.',
links:[5,15,17],
quiz:[Q('VP = 15, VN = 70, FP = 10, FN = 5. ¿Cuánto vale la especificidad?',['75 %','87,5 %','85 %','60 %'],1,'70 / (70 + 10).'),
Q('Con esos datos, ¿cuánto vale la FPR?',['12,5 %','25 %','40 %','5 %'],0,'1 − 0,875, o 10/80.'),
Q('Un falso negativo corresponde a un error de…',['Tipo I','Tipo II','Muestreo','Redondeo'],1,'Es la omisión: β.'),
Q('Precisión 0,9 y Recall 0,1. ¿Cuánto vale F1?',['0,50','0,18','0,90','0,09'],1,'2·0,9·0,1 / (0,9 + 0,1).')]},

{n:17,eje:5,short:'ROC, AUC, umbral y Youden',title:'Curva ROC, AUC, umbral e índice de Youden',
lead:'Cómo evaluar el clasificador sin atarse a un umbral, y cómo elegir después el mejor punto de corte.',
html:`${D('La <b>curva ROC</b> grafica la <b>sensibilidad (TPR)</b> en el eje Y contra la <b>tasa de falsos positivos (FPR = 1 − especificidad)</b> en el eje X, para todos los umbrales posibles.')}
${W('umbral')}
${L(['Cada punto de la curva es un umbral.','La diagonal es un clasificador que adivina al azar.','El punto ideal es la esquina superior izquierda.'])}
<h3>AUC</h3>
<p>El <b>área bajo la curva</b> resume la capacidad de discriminar, sin depender del umbral. AUC = 0,5 es azar; AUC = 1 es separación perfecta.</p>
${D('<b>AUC = 0,89</b> significa que, si tomo al azar un positivo y un negativo, el modelo le asigna una puntuación más alta al positivo aproximadamente el 89 % de las veces.')}
${TRAP('Leer AUC = 0,89 como "89 % de aciertos". Mide capacidad de ordenar, no Accuracy.')}
<h3>Por qué 0,50 falla con eventos poco frecuentes</h3>
<p>Si la prevalencia es baja (por ejemplo 5 %), muy pocos casos llegan a una probabilidad estimada de 0,5. Con el umbral estándar, la mayoría de los positivos reales queda por debajo del corte: <b>muchísimos falsos negativos</b>. Probalo arriba: bajá la prevalencia y mirá el Recall con umbral 0,5.</p>
<p>${EJ}Un incumplidor con puntuación 0,40 se pierde con umbral 0,50, pero se detecta con 0,30. Bajar el umbral tampoco es gratis: aumentan las falsas alarmas.</p>
<h3>Índice de Youden</h3>
${F('J = Sensibilidad + Especificidad − 1 = TPR − FPR')}
<p>El <b>índice de Youden</b> elige el umbral que maximiza J: el punto de la curva ROC más alejado, en vertical, de la diagonal del azar.</p>
<p>${EJ}Con umbrales 0,3 / 0,5 / 0,7 y J = 0,50 / 0,60 / 0,45, se elige 0,5. Es un criterio estadístico: si un falso negativo cuesta mucho más que un falso positivo, puede convenir otro umbral.</p>`,
coloquio:'En la curva ROC el eje X es la tasa de falsos positivos, uno menos especificidad, y el eje Y es la sensibilidad; cada punto es un umbral. AUC 0,89 significa 89 % de probabilidad de puntuar más alto a un positivo que a un negativo, no 89 % de aciertos. Con eventos raros el umbral 0,5 genera muchos falsos negativos; Youden maximiza sensibilidad más especificidad menos uno.',
links:[15,16],
quiz:[Q('¿Qué va en el eje X de la curva ROC?',['Sensibilidad','Precisión','Tasa de falsos positivos','Umbral'],2,'FPR = 1 − especificidad.'),
Q('Sensibilidad 0,80 y especificidad 0,70. ¿Cuánto vale J?',['1,50','0,50','0,10','0,56'],1,'0,80 + 0,70 − 1.'),
Q('Con prevalencia del 5 %, el umbral 0,50 suele producir…',['Muchos falsos positivos','Muchos falsos negativos','AUC = 1','Accuracy baja'],1,'Pocos positivos superan el corte.'),
Q('AUC = 0,5 corresponde a…',['Un modelo perfecto','Un modelo que no discrimina mejor que el azar','50 % de Recall','Umbral 0,5'],1,'Es la diagonal.')]},

{n:18,eje:6,short:'Reglas de probabilidad y Bayes',title:'Repaso: reglas de probabilidad y teorema de Bayes',
lead:'La base de todo lo anterior, con los ejercicios de la práctica de la Unidad II (parte a).',
html:`${D('El <b>espacio muestral</b> es el conjunto de todos los resultados posibles. Con resultados igualmente probables: P(A) = casos favorables / casos posibles.')}
<p>${EJ}Tres monedas: 8 resultados posibles. P(al menos una cara) = 1 − P(ninguna) = 1 − 1/8 = 7/8.</p>
${TRAP('Al tirar dos monedas, decir que 0, 1 o 2 caras valen 1/3 cada una. Los resultados igualmente probables son CC, CX, XC, XX: P(0) = 1/4, P(1) = 2/4, P(2) = 1/4.')}
${T(['Regla','Fórmula','Cuándo'],[['Complemento','P(no A) = 1 − P(A)','"Al menos uno", "ninguno"'],['Suma','P(A o B) = P(A) + P(B) − P(A y B)','Unión. Si son excluyentes, P(A y B) = 0'],['Condicional','P(A | B) = P(A y B) / P(B)','Se sabe que B ocurrió'],['Producto','P(A y B) = P(A) · P(B | A)','Intersección. Si son independientes: P(A) · P(B)']])}
${MINI([['Mutuamente excluyentes','No pueden ocurrir a la vez: P(A y B) = 0.'],['Independientes','Que ocurra uno no cambia la probabilidad del otro: P(A | B) = P(A).']])}
<h3>El ejercicio de los pasajes</h3>
${T(['','Mujer','Varón','Total'],[['Fumador','10','25','35'],['No fumador','30','35','65'],['Total','40','60','100']])}
${L(['<b>Marginal:</b> P(mujer) = 40/100 = 0,40.','<b>Conjunta</b> (regla del producto): P(varón y fumador) = 25/100 = 0,25.','<b>Unión</b> (regla de la suma): P(mujer o fumador) = 0,40 + 0,35 − 0,10 = 0,65.','<b>Condicional:</b> P(fumadora | mujer) = 10/40 = 0,25.','<b>Suceso cierto:</b> P(fumador o no fumador) = 1.'])}
${W('sortSuc')}
<h3>Probabilidad total y Bayes</h3>
${F(`P(A | B) = ${FR('P(B | A) · P(A)','P(B)')}`)}
<p>La <b>probabilidad total</b> suma todos los caminos que llevan a B. ${EJ}Televisores: 0,50 · 0,25 + 0,30 · 0,20 + 0,20 · 0,10 = 0,205 necesita reparación.</p>
${W('bayes')}`,
coloquio:'Para "A o B" sumo las probabilidades y resto la intersección; para "A y B" multiplico, usando la condicional si no son independientes. Dos sucesos son excluyentes si no pueden ocurrir juntos, e independientes si uno no cambia la probabilidad del otro. Bayes permite invertir una probabilidad condicional usando la probabilidad total.',
links:[19,5,16],
quiz:[Q('P(A) = 0,458, P(B) = 0,54 y P(A y B) = 0,30. ¿Cuánto vale P(A o B)?',['0,998','0,698','0,30','0,247'],1,'0,458 + 0,54 − 0,30. Es el ejercicio del alquiler de autos.'),
Q('Dos sucesos son mutuamente excluyentes si…',['P(A y B) = 0','P(A | B) = P(A)','P(A) = P(B)','P(A o B) = 1'],0,'No pueden ocurrir a la vez.'),
Q('En la tabla de pasajes, P(mujer | fumador) vale…',['10/40','10/35','10/100','35/100'],1,'El universo se reduce a los 35 fumadores.'),
Q('Dos clientes independientes pagan en término con p = 0,82. P(al menos uno paga) es…',['0,6724','0,82','0,9676','0,18'],2,'1 − 0,18².')]},

{n:19,eje:6,short:'Binomial y normal',title:'Repaso: variable aleatoria, binomial y normal',
lead:'Las dos distribuciones que sostienen la inferencia, con los ejercicios de la práctica (parte b).',
html:`${D('Una <b>variable aleatoria</b> asigna un número a cada resultado de un experimento. Su <b>esperanza</b> es el promedio ponderado por las probabilidades: E(X) = Σ x · P(x).')}
<p>${EJ}Recuperación de una inversión: 0·0,20 + 10·0,25 + 15·0,30 + 25·0,15 + 50·0,10 = 15,75. P(al menos $15) = 0,30 + 0,15 + 0,10 = 0,55.</p>
<h3>Distribución binomial</h3>
<p>Cuenta la cantidad de éxitos en <b>n ensayos independientes</b>, cada uno con solo dos resultados y la misma probabilidad de éxito p.</p>
${F('P(X = k) = C(n, k) · p<sup>k</sup> · (1 − p)<sup>n − k</sup> &nbsp;&nbsp; E(X) = n·p &nbsp;&nbsp; Var(X) = n·p·(1 − p)')}
${W('binomial')}
${T(['Dice el enunciado','Se calcula'],[['"Exactamente k"','P(X = k)'],['"A lo sumo k", "no más de k", "cuanto mucho k"','P(X ≤ k)'],['"Al menos k", "por lo menos k"','P(X ≥ k) = 1 − P(X ≤ k − 1)'],['"Más de k"','P(X > k) = 1 − P(X ≤ k)'],['"Entre a y b" (incluidos)','P(X ≤ b) − P(X ≤ a − 1)']])}
<h3>Distribución normal</h3>
<p>Continua, simétrica y con forma de campana. Queda definida por su media μ y su desvío σ. Para calcular probabilidades se <b>estandariza</b>:</p>
${F(`z = ${FR('x − μ','σ')}`)}
${W('normal')}
${L(['<b>P(X &gt; μ) = 0,5</b> siempre, por simetría.','<b>Problema inverso:</b> si piden el valor que deja el 90 % por debajo, se busca z = 1,28 y se despeja x = μ + z·σ. En el examen: 70 + 1,28 · 12 ≈ 85,4 minutos.','<b>Latas:</b> con μ = 326 y σ = 18, P(X &lt; 330) = P(z &lt; 0,22) ≈ 0,59.'])}
<p>La normal es la que hace posible el módulo 1: por el Teorema Central del Límite, las medias muestrales se distribuyen (aproximadamente) así.</p>`,
coloquio:'La binomial cuenta éxitos en n ensayos independientes con la misma probabilidad p; su esperanza es n por p y su varianza n por p por uno menos p. La normal es continua y simétrica: para calcular probabilidades estandarizo con z igual a x menos mu sobre sigma. Alrededor del 68, 95 y 99,7 % de los datos cae a uno, dos y tres desvíos de la media.',
links:[18,2,4],
quiz:[Q('En una binomial con n = 10 y p = 0,2, la esperanza es…',['0,2','2','1,6','8'],1,'n·p.'),
Q('"Por lo menos 2" se calcula como…',['P(X ≤ 2)','1 − P(X ≤ 1)','1 − P(X ≤ 2)','P(X = 2)'],1,'El complemento de "0 o 1".'),
Q('X ~ N(70; 12). ¿Cuánto vale z para x = 85?',['1,25','0,85','15','1,5'],0,'(85 − 70) / 12.'),
Q('¿Qué porcentaje de una normal cae en μ ± 2σ?',['68 %','90 %','95 %','99,7 %'],2,'Regla empírica.')]}
];

const B=(m,q,a,t,r)=>[m,q,a,t,r];
const BANK=[
B(1,'¿Cuál es la diferencia conceptual fundamental entre un parámetro poblacional y un estimador muestral?','Un parámetro es una característica fija, aunque generalmente desconocida, de toda la población, como su media μ. Un estimador es una fórmula calculada con una muestra, como la media muestral, para aproximar ese parámetro.',1,'¿El parámetro cambia al tomar otra muestra? No. Lo que cambia es la estimación muestral.'),
B(1,'En la estimación por intervalos de confianza, ¿qué representa el nivel de confianza (1 − α)?','Un 95 % de confianza significa que, si repitiéramos muchas veces el muestreo, alrededor del 95 % de los intervalos calculados incluirían el valor real de la población. No es una probabilidad del parámetro fijo.',3,'¿Qué representa α = 0,05? El nivel de error nominal del procedimiento: el 5 % de los intervalos no contendría al parámetro.'),
B(1,'¿Qué establece el Teorema del Límite Central sobre la distribución de la media muestral para muestras grandes?','Dice que, bajo condiciones adecuadas y con muestras suficientemente grandes, la distribución de la media muestral se aproxima a una normal, aunque la población original no sea normal.',2,'¿Los datos originales deben ser normales? No necesariamente; se requiere independencia y varianza finita.'),
B(1,'¿Cómo afecta el aumento del tamaño muestral (n) al error estándar de la media?','El error estándar es σ sobre raíz de n. Cuanto más grande es la muestra, menor es. Para reducirlo a la mitad necesitamos aproximadamente cuatro veces más datos.',2,'¿Qué pasa si cuadruplico n? El error estándar se reduce a la mitad.'),
B(1,'¿Cuándo se debe utilizar la distribución t-Student en lugar de la Normal Estándar Z para estimar una media?','Usamos t de Student cuando la desviación estándar poblacional es desconocida y la estimamos con la muestra, especialmente con muestras pequeñas y datos aproximadamente normales.',3,'¿Cuándo se parece t a Z? Cuando aumentan los grados de libertad.'),
B(1,'¿Por qué se utiliza p = 0,50 al calcular el tamaño muestral para estimar una proporción sin información previa?','Porque 0,50 maximiza el producto p(1 − p), la variabilidad de una proporción. Así calculamos un tamaño de muestra conservador cuando no sabemos la proporción real.',4,'¿Por qué no elegir p = 0,1 sin evidencia? Porque podría subestimar la variabilidad y el tamaño requerido.'),
B(1,'¿Qué significa formalmente que un estimador estadístico sea insesgado?','Que su valor esperado coincide con el parámetro: E(estimador) = parámetro. Si repetimos el muestreo muchas veces, sus estimaciones promedian el valor real; no se desvía siempre hacia el mismo lado.',1,'¿Insesgado significa sin error? No. Puede tener variabilidad aunque su promedio sea correcto.'),
B(1,'¿Qué condiciones empíricas deben cumplirse para aproximar la distribución de una proporción muestral mediante una Normal?','Necesitamos observaciones independientes y suficientes casos de ambos resultados. Como regla habitual, al menos diez éxitos y diez fracasos esperados: np ≥ 10 y n(1 − p) ≥ 10.',4,'¿Qué sucede con eventos extremadamente raros? Puede hacer falta una muestra mucho mayor o métodos exactos.'),
B(2,'¿Cuáles son las hipótesis nula (H₀) y alternativa (H₁) en las pruebas de normalidad de Shapiro-Wilk o Kolmogorov-Smirnov?','En Shapiro-Wilk, la hipótesis nula dice que los datos siguen una distribución normal y la alternativa dice que no. Kolmogorov-Smirnov compara los datos con una distribución especificada, que puede ser la normal.',7,'¿p > 0,05 demuestra normalidad? No; solo indica evidencia insuficiente para rechazar H₀.'),
B(2,'¿Por qué un tamaño de muestra muy grande puede ser problemático al interpretar el p-valor de una prueba de normalidad?','Con muestras muy grandes, las pruebas detectan desviaciones mínimas de la normalidad y pueden dar p-valores pequeños aunque la diferencia sea poco relevante en la práctica. Conviene complementar con gráficos y contexto.',7,'¿Qué conviene revisar además del p-valor? El Q-Q plot, el histograma y las necesidades del análisis.'),
B(2,'¿Qué utilidad principal aporta el Q-Q plot frente a las pruebas formales de normalidad?','El Q-Q plot compara cuantiles observados con los de una distribución teórica. Si los puntos siguen aproximadamente una recta, hay compatibilidad visual; las desviaciones revelan asimetría, colas pesadas o valores extremos.',7,'¿Qué muestra una línea diagonal? Compatibilidad aproximada con la distribución teórica.'),
B(2,'Conceptual y matemáticamente, ¿qué representa el estadístico t en una prueba t de Student?','Mide cuántos errores estándar separan la diferencia observada de la planteada por la hipótesis nula: es señal sobre ruido. En una muestra: t = (media − μ₀) / (s / √n).',6,'¿Un t grande siempre implica un efecto importante? No; también depende del tamaño de muestra y del error estándar.'),
B(2,'¿En qué consiste la "trampa de la multiplicidad" al realizar múltiples pruebas t para comparar 3 o más grupos?','Al hacer muchas pruebas t aumenta la probabilidad de obtener al menos un falso positivo. Para comparar tres o más medias se usa primero ANOVA y, si corresponde, comparaciones múltiples controladas.',8,'¿Qué problema controla Tukey? El error familiar al comparar varios pares de medias.'),
B(2,'¿Cuál es la función del test ANOVA ómnibus en la comparación de múltiples medias poblacionales?','ANOVA contrasta si todas las medias poblacionales son iguales frente a la alternativa de que al menos una difiere. Un resultado significativo no indica por sí solo cuáles grupos son diferentes.',8,'¿Un ANOVA significativo dice qué grupos difieren? No; hacen falta comparaciones post-hoc.'),
B(2,'¿Qué evalúa la prueba de Levene en el contexto previo a un ANOVA unidireccional?','Levene evalúa si las varianzas de los grupos pueden considerarse iguales. Sirve para revisar el supuesto de homogeneidad de varianzas antes de aplicar el ANOVA clásico.',8,'¿Qué hacemos si Levene rechaza H₀? Considerar el ANOVA de Welch.'),
B(2,'Si se viola el supuesto de homocedasticidad en ANOVA, ¿qué alternativa paramétrica ajustada se debe emplear?','Cuando no hay igualdad de varianzas, la alternativa paramétrica habitual es el ANOVA de Welch, que ajusta el procedimiento para varianzas desiguales.',8,'¿Welch exige varianzas iguales? No; está diseñado para no requerirlas.'),
B(2,'¿Cuál es el propósito del test de comparación múltiple post-hoc de Tukey HSD?','Tukey HSD realiza comparaciones por pares entre medias después del ANOVA y controla el error familiar por múltiples comparaciones. Permite identificar qué pares de grupos difieren.',8,'¿Para qué sirve un post-hoc? Para identificar qué pares de grupos difieren.'),
B(2,'¿Qué prueba no paramétrica sustituye a la t de Student para dos muestras independientes cuando no se cumple la normalidad?','La prueba de Mann-Whitney U. Compara distribuciones usando rangos; no siempre equivale a comparar medianas sin supuestos adicionales.',6,'¿Mann-Whitney compara siempre medianas? Solo si las distribuciones tienen la misma forma.'),
B(3,'¿Cuál es la diferencia fundamental entre el análisis de correlación y el de regresión?','La correlación cuantifica la fuerza y dirección de una asociación, sin distinguir variable explicativa y respuesta. La regresión modela una variable respuesta en función de predictores para explicar o predecir. Ninguna prueba causalidad por sí sola.',9,'¿Correlación implica causalidad? No; pueden intervenir otras variables.'),
B(3,'¿Qué mide exactamente el coeficiente de correlación de Pearson (r) y cuál es su rango?','Pearson r mide la fuerza y dirección de la asociación lineal entre dos variables cuantitativas. Varía entre −1 y 1: cerca de 1 es positiva fuerte; cerca de −1, negativa fuerte; cerca de 0, poca asociación lineal.',9,'¿Qué significa r = 0? Que no hay asociación lineal, aunque puede existir una relación curva.'),
B(3,'En ŷ = β₀ + β₁x, ¿cómo se interpreta geométrica y conceptualmente la pendiente (β₁)?','La pendiente indica cuánto cambia el valor esperado de Y cuando X aumenta una unidad. Geométricamente es la inclinación de la recta: positiva si sube y negativa si baja.',10,'¿Qué significa β₁ negativo? Que la predicción disminuye al aumentar X.'),
B(3,'¿Qué representa el intercepto (β₀) y cuándo tiene significado práctico?','El intercepto es el valor predicho de Y cuando X = 0. Tiene interpretación práctica si cero es un valor posible y relevante; de lo contrario es principalmente un parámetro matemático.',10,'¿El intercepto siempre tiene significado? No; puede ser una extrapolación sin sentido.'),
B(3,'¿En qué consiste el principio de Mínimos Cuadrados Ordinarios (OLS/MCO)?','Mínimos Cuadrados Ordinarios elige los coeficientes que minimizan la suma de los residuos al cuadrado. Así ajusta la recta que reduce los errores cuadráticos en la muestra.',10,'¿Por qué se elevan al cuadrado? Para que los signos no se cancelen y para penalizar los errores grandes.'),
B(3,'¿Qué mide el coeficiente de determinación (R²) y cómo se interpreta un R² = 0,81?','R² mide la proporción de variabilidad de Y explicada por el modelo respecto de la media. R² = 0,81 significa que el modelo explica el 81 % de esa variabilidad en los datos evaluados; no demuestra causalidad.',11,'¿R² puede ser negativo? Sí, fuera de muestra, si el modelo es peor que predecir la media.'),
B(3,'¿Qué es un residuo (eᵢ) en regresión lineal y qué papel cumple en el diagnóstico del modelo?','Un residuo es la diferencia entre el valor observado y el predicho. Analizar sus patrones ayuda a detectar no linealidad, varianza desigual, observaciones extremas u otros problemas del modelo.',11,'¿Qué esperamos en un gráfico de residuos? Una nube sin patrón y con dispersión estable.'),
B(3,'¿Qué establece el supuesto de homocedasticidad de los errores?','Que la varianza de los errores es constante para los distintos valores de los predictores. Si falla, los errores estándar y las pruebas clásicas pueden ser poco confiables.',11,'¿Qué forma sugiere heterocedasticidad? Un abanico o embudo en los residuos.'),
B(3,'¿Por qué se debe utilizar el R² ajustado en lugar del R² convencional en regresión múltiple?','R² nunca disminuye al agregar predictores, incluso inútiles. El R² ajustado penaliza incorporar variables y permite comparar modelos con distinta cantidad de predictores de manera más justa.',12,'¿El R² ajustado puede bajar? Sí, cuando la mejora no compensa la complejidad.'),
B(3,'¿Qué es la multicolinealidad y qué efecto negativo produce sobre las estimaciones?','Multicolinealidad significa que dos o más predictores están muy relacionados. Aumenta la incertidumbre y vuelve inestables los coeficientes. Se puede revisar el VIF y eliminar, combinar o regularizar variables.',12,'¿Cómo reducir la multicolinealidad? Quitar o combinar predictores redundantes, o usar regularización.'),
B(4,'¿Por qué la regresión lineal por OLS es inadecuada para modelar una respuesta binaria (0/1)?','Porque puede predecir valores menores que 0 o mayores que 1, y sus supuestos de error y varianza normalmente no se cumplen. La logística modela probabilidades entre 0 y 1.',13,'¿OLS nunca se usa con respuestas binarias? Existe el modelo de probabilidad lineal, pero tiene limitaciones.'),
B(4,'¿Qué función matemática transforma el predictor lineal en una probabilidad acotada entre 0 y 1?','La función sigmoide: p = 1 / (1 + e^(−z)), donde z es la combinación lineal de predictores. Transforma cualquier número real en una probabilidad entre cero y uno.',13,'¿Qué ocurre cuando z crece? La probabilidad se acerca a 1.'),
B(4,'¿Qué es el "logit" o log-odds en la regresión logística?','El logit es el logaritmo de las odds: ln[p / (1 − p)]. En regresión logística se modela como una combinación lineal de predictores.',14,'¿Qué implica logit = 0? Probabilidad 0,5.'),
B(4,'¿Cómo se define matemáticamente el Odds de un evento cuya probabilidad es p?','Las odds son p / (1 − p): la probabilidad de que ocurra dividida por la probabilidad de que no ocurra. Si p = 0,75, las odds son 3 a 1.',14,'¿Odds = 3 significa p = 3? No; corresponde a p = 3/4 = 0,75.'),
B(4,'Si el coeficiente β₁ en regresión logística es 0,405, ¿cuál es su Odds Ratio y cómo se interpreta?','El Odds Ratio es e^0,405 ≈ 1,50. Por cada unidad adicional de ese predictor, manteniendo los demás constantes, las odds del evento se multiplican por 1,5: aumentan un 50 %.',14,'¿Es un aumento del 50 % en probabilidad? No, es un aumento del 50 % en odds.'),
B(4,'Si un predictor presenta un Odds Ratio de 0,65, ¿es un factor de riesgo o de protección?','Un OR de 0,65 indica que, por cada unidad adicional del predictor, las odds se multiplican por 0,65, es decir disminuyen 35 %. Es protector si el evento definido es perjudicial.',14,'¿OR < 1 siempre es beneficioso? No; depende de cuál sea el evento positivo.'),
B(4,'¿Por qué la pendiente (efecto marginal) sobre la probabilidad no es constante en la regresión logística?','Porque la probabilidad es una función sigmoide, no una recta. El efecto marginal de X sobre p depende de la probabilidad actual: β₁ · p(1 − p), por lo que cambia según el punto.',15,'¿Dónde cambia más la probabilidad? Cerca de p = 0,5.'),
B(4,'¿En qué punto de la probabilidad predicha la pendiente marginal es máxima y a qué equivale?','El máximo de p(1 − p) ocurre en p = 0,5, donde vale 0,25. Por eso el efecto marginal máximo es β₁ / 4.',15,'¿Y si β₁ es negativo? La pendiente es negativa; su magnitud máxima es |β₁| / 4.'),
B(4,'¿Qué prueba estadística evalúa la significancia individual de los coeficientes en una regresión logística?','La prueba de Wald: compara cada coeficiente con su error estándar para ver si difiere de cero. También puede usarse una prueba de razón de verosimilitudes comparando modelos.',15,'¿p < 0,05 implica un efecto grande? No; significancia estadística no es relevancia práctica.'),
B(4,'¿Qué representa el Pseudo R² de McFadden y qué rango indica un ajuste excelente?','Compara la log-verosimilitud del modelo con la del modelo nulo: 1 − LL modelo / LL nulo. Valores aproximados de 0,2 a 0,4 se consideran muy buenos; no equivale al R² lineal.',15,'¿Qué es el modelo nulo? El modelo con solo el intercepto.'),
B(5,'¿Cuáles son los cuatro componentes de una matriz de confusión binaria?','VP: predijo positivo y era positivo. VN: predijo negativo y era negativo. FP: predijo positivo pero era negativo. FN: predijo negativo pero era positivo.',16,'¿Qué es un falso negativo? Un positivo real que fue clasificado como negativo.'),
B(5,'¿Por qué la Exactitud (Accuracy) resulta engañosa en datos fuertemente desbalanceados?','Si una clase domina, predecirla siempre puede dar una Accuracy alta sin identificar los casos minoritarios. Por eso conviene revisar la matriz de confusión, Precisión, Recall y F1.',16,'¿Qué métrica revela los positivos omitidos? El Recall.'),
B(5,'¿Cómo se define la Sensibilidad (Recall) y qué tipo de errores busca minimizar?','Recall o sensibilidad es VP / (VP + FN): la proporción de positivos reales detectados. Un Recall alto busca minimizar los falsos negativos, importante cuando omitir un caso es costoso.',16,'¿Recall = 1 implica cero falsos positivos? No; solo que no se omitieron positivos reales.'),
B(5,'¿Cómo se define la Especificidad y cuál es su relación con la Tasa de Falsos Positivos (FPR)?','Especificidad es VN / (VN + FP): la proporción de negativos reales identificados. La tasa de falsos positivos es FP / (FP + VN), por lo tanto especificidad = 1 − FPR.',16,'¿Qué mide la FPR? La proporción de negativos reales clasificados como positivos.'),
B(5,'¿Qué es el F1-Score y por qué utiliza la media armónica en lugar del promedio simple?','F1 combina Precisión y Recall mediante la media armónica: 2PR / (P + R). Penaliza más el desequilibrio entre ambas que un promedio aritmético, por eso requiere que las dos sean buenas.',16,'¿F1 incluye directamente a los VN? No; usa VP, FP y FN.'),
B(5,'¿Qué representan el eje X y el eje Y en una Curva ROC?','El eje X es la tasa de falsos positivos, FPR = 1 − especificidad; el eje Y es la tasa de verdaderos positivos, TPR = Recall. Cada punto corresponde a un umbral diferente.',17,'¿Qué representa la diagonal? Una discriminación equivalente al azar.'),
B(5,'¿Qué significa en términos prácticos un AUC-ROC igual a 0,89?','Que el modelo tiene aproximadamente 89 % de probabilidad de asignar una puntuación mayor a un positivo elegido al azar que a un negativo elegido al azar. Indica buena discriminación, no 89 % de Accuracy.',17,'¿Qué significa AUC = 0,5? Que no discrimina mejor que el azar.'),
B(5,'¿Por qué fijar el umbral en 0,50 genera fallos graves cuando la prevalencia es muy baja (por ejemplo 5 %)?','Con eventos raros, usar 0,50 deja muchos casos positivos por debajo del umbral y genera falsos negativos. El umbral debe elegirse con validación, según prevalencia, costos y el equilibrio entre sensibilidad y falsas alarmas.',17,'¿Conviene siempre bajar el umbral? No; también aumentan las falsas alarmas.'),
B(5,'¿Qué métrica u optimización permite encontrar el umbral óptimo en una curva ROC?','El índice de Youden: maximiza sensibilidad + especificidad − 1, equivalente a TPR − FPR. Es una opción para elegir el umbral, pero el punto óptimo real depende de los costos y prioridades del problema.',17,'¿Por qué podría elegirse otro umbral? Porque los costos de FP y FN pueden ser diferentes.')
];

['Pseudo R² de McFadden','1 − LL modelo / LL nulo; 0,2 a 0,4 es un ajuste excelente.',15],
['Matriz de confusión','Tabla de VP, VN, FP y FN.',16],
['Sensibilidad (Recall)','VP / (VP + FN).',16],
['Especificidad','VN / (VN + FP).',16],
['Precisión (PPV)','VP / (VP + FP).',16],
['F1-Score','Media armónica de Precisión y Recall.',16],
['Curva ROC','TPR contra FPR para todos los umbrales.',17],
['AUC','Área bajo la ROC: probabilidad de puntuar más alto a un positivo que a un negativo.',17],
['Índice de Youden','J = sensibilidad + especificidad − 1; se maximiza para elegir el umbral.',17],
['Sucesos excluyentes','No pueden ocurrir a la vez.',18],
['Sucesos independientes','Que ocurra uno no cambia la probabilidad del otro.',18],
['Teorema de Bayes','Permite invertir una probabilidad condicional.',18],
['Distribución binomial','Cantidad de éxitos en n ensayos independientes con probabilidad p.',19],
['Distribución normal','Continua, simétrica, en forma de campana; definida por μ y σ.',19],
['Puntaje z','(x − μ) / σ: a cuántos desvíos de la media está un valor.',19]
];

/* ---------- estado y vistas ---------- */
const byN=n=>TOPICS.find(t=>t.n===n);
const U=SITE.units,UN=U.map((_,i)=>i).filter(i=>U[i]);
let S={done:{},known:{},oral:{},best:0};
try{Object.assign(S,JSON.parse(localStorage.getItem(SITE.key))||{})}catch(e){}
const save=()=>{try{localStorage.setItem(SITE.key,JSON.stringify(S))}catch(e){}};
const doneCount=()=>TOPICS.filter(t=>S.done[t.n]).length;
const oralCount=()=>BANK.filter((_,i)=>S.oral[i]).length;
const main=$('#main'),side=$('#side');
const TOOLS=[['tarjetas','Tarjetas de repaso'],['quiz','Autoevaluación'],['oral','Simulador oral'],...(typeof FORMULAS!=='undefined'?[['formulas','Fórmulas clave']]:[]),['glosario','Glosario']];
function renderSide(cur){
  const d=doneCount();
  side.innerHTML=`<a class="brand" href="#inicio">${SITE.name}<small>${SITE.sub}</small></a>
  <div class="prog"><div class="prog-bar"><i style="width:${d/TOPICS.length*100}%"></i></div><small>${d} de ${TOPICS.length} temas estudiados</small></div>
  <nav class="nav"><a href="#inicio" class="${cur==='inicio'?'on':''}">Mapa de la materia</a>
  ${UN.map(e=>`<div class="eje-${e}"><h4>${U[e].n} · ${U[e].t}</h4>${TOPICS.filter(t=>t.eje===e).map(t=>`<a href="#tema-${t.n}" class="${cur==='tema-'+t.n?'on ':''}${S.done[t.n]?'done':''}"><span class="num">${t.n}</span><span>${t.short}</span><span class="ck" title="${S.done[t.n]?'Estudiado':'Pendiente'}"></span></a>`).join('')}</div>`).join('')}
  <h4>Practicar</h4>${TOOLS.map(([h,t])=>`<a href="#${h}" class="${cur===h?'on':''}">${t}</a>`).join('')}</nav>
  ${SITE.other.url?`<a class="switch" href="${SITE.other.url}" target="_blank" rel="noopener">Ir a la otra materia<b>${SITE.other.name} →</b></a>`:''}`;
}
function vInicio(){
  const next=TOPICS.find(t=>!S.done[t.n])||TOPICS[0],d=doneCount();
  main.innerHTML=`<div class="wrap wide">
  <div class="hero"><div><p class="eyebrow">${SITE.eyebrow}</p><h1>${SITE.h1}</h1><p class="lead">${SITE.lead}</p>
  <div class="row"><a class="btn acc" href="#tema-${next.n}">${d?'Seguir con':'Empezar por'} el tema ${next.n}</a><a class="btn ghost" href="#oral">Practicar el oral</a></div></div>
  <div class="exam">${SITE.exam}</div></div>
  ${SITE.hilo}
  <h2>${SITE.unitsTitle}</h2>
  <div class="ejes">${UN.map(e=>`<div class="ejecard eje-${e}"><p class="eyebrow">${U[e].n}</p><h3>${U[e].t}</h3><p>${U[e].q}</p>${TOPICS.filter(t=>t.eje===e).map(t=>`<a href="#tema-${t.n}"><span class="num">${t.n}</span><span>${t.short}</span>${S.done[t.n]?'<span class="ck">Listo</span>':''}</a>`).join('')}</div>`).join('')}</div>
  <h2>Para practicar</h2>
  <div class="tools"><a href="#oral"><b>Simulador oral</b><span>Las ${BANK.length} preguntas de la guía del profesor, con cronómetro de ${SITE.secs} segundos y respuesta modelo. Llevás ${oralCount()} sabidas.</span></a><a href="#quiz"><b>Autoevaluación</b><span>10 preguntas de opción múltiple al azar de un banco de ${TOPICS.reduce((s,t)=>s+t.quiz.length,0)}, con explicación.${S.best?` Tu mejor nota: ${S.best}/10.`:''}</span></a><a href="#tarjetas"><b>Tarjetas de repaso</b><span>${GLOS.length} conceptos para decir la definición antes de darla vuelta.</span></a>${typeof FORMULAS!=='undefined'?`<a href="#formulas"><b>Fórmulas clave</b><span>Todas las fórmulas en una sola hoja, con para qué sirve cada una.</span></a>`:''}<a href="#glosario"><b>Glosario</b><span>Buscá cualquier término y saltá al tema donde se explica.</span></a></div>
  <h2>Una forma de estudiar con esta página</h2>
  ${FLOW([['Leé el tema','y jugá con el gráfico o la calculadora.'],['Decí en voz alta','la frase "Para decir en el oral" sin mirarla.'],['Respondé','las preguntas del final.'],['Marcalo como estudiado','y seguí con el que le sigue.'],['Cerrá con el simulador','hasta responder cada pregunta en '+SITE.secs+' segundos.']])}
  </div>`;
}
function vTema(n){
  const t=byN(n),prev=byN(n-1),nxt=byN(n+1),qs=BANK.map((b,i)=>[b,i]).filter(x=>x[0][3]===n);
  main.innerHTML=`<article class="wrap eje-${t.eje}"><p class="eyebrow">${U[t.eje].n} · Tema ${t.n} de ${TOPICS.length}</p><h1>${t.title}</h1><p class="lead">${t.lead}</p>${t.html}
  <div class="coloquio"><small>Para decir en el oral</small><p>"${t.coloquio}"</p></div>
  ${qs.length?`<h2>Preguntas de la guía del profesor sobre este tema</h2>${qs.map(([b])=>`<details><summary>${b[1]}</summary><p class="say">${b[2]}</p>${b[4]?`<p><b>Posible repregunta:</b> ${b[4]}</p>`:''}</details>`).join('')}`:''}
  <p class="links" style="margin-top:1.4rem"><span>Se conecta con</span>${t.links.map(l=>`<a href="#tema-${l}">${byN(l).short}</a>`).join('')}</p>
  <h2>Comprobá si lo entendiste</h2><div id="tq"></div>
  <div class="foot"><button class="btn ${S.done[n]?'ghost':'acc'}" id="mark">${S.done[n]?'Estudiado · desmarcar':'Marcar como estudiado'}</button><span class="row" style="margin:0">${prev?`<a class="btn ghost" href="#tema-${prev.n}">← Tema ${prev.n}</a>`:''}${nxt?`<a class="btn" href="#tema-${nxt.n}">Tema ${nxt.n}: ${nxt.short} →</a>`:`<a class="btn" href="#oral">Ir al simulador →</a>`}</span></div></article>`;
  $$('.w',main).forEach(w=>WIDGETS[w.dataset.w]&&WIDGETS[w.dataset.w](w));
  t.quiz.forEach((q,i)=>$('#tq').appendChild(qCard(q,i+1)));
  $('#mark').onclick=()=>{S.done[n]=!S.done[n];save();const b=$('#mark');b.className='btn '+(S.done[n]?'ghost':'acc');b.textContent=S.done[n]?'Estudiado · desmarcar':'Marcar como estudiado';renderSide('tema-'+n)};
}
function vTarjetas(){
  let pend=false,i=0,flip=false,deck=shuffle(GLOS);
  main.innerHTML=`<div class="wrap"><p class="eyebrow">Practicar</p><h1>Tarjetas de repaso</h1><p class="lead">Decí la definición en voz alta y después tocá la tarjeta para compararla.</p><div id="fc"></div></div>`;
  const draw=()=>{
    const list=pend?deck.filter(g=>!S.known[g[0]]):deck,kn=GLOS.filter(g=>S.known[g[0]]).length;
    if(i>=list.length)i=0;
    if(!list.length){$('#fc').innerHTML=`<div class="card"><p class="big">Ya sabés las ${GLOS.length}.</p><button class="btn" data-all>Ver todas de nuevo</button></div>`;$('[data-all]').onclick=()=>{pend=false;draw()};return}
    const g=list[i];
    $('#fc').innerHTML=`<div class="row"><span>${i+1} de ${list.length}</span><span class="pill ok">${kn} sabidas</span><label class="sp" style="display:flex;gap:8px;align-items:center;font-size:.9rem"><input type="checkbox" id="fc-p" ${pend?'checked':''}> Solo las que me faltan</label></div>
    <button class="flash" aria-live="polite">${flip?`<small>${g[0]}</small><span class="back">${g[1]}</span>`:`<span class="term">${g[0]}</span><small>Tocá para ver la definición</small>`}</button>
    <div class="row"><button class="btn ghost" data-p>← Anterior</button><button class="btn ghost" data-n>Siguiente →</button><span class="sp row" style="margin:0"><a class="btn ghost sm" href="#tema-${g[2]}">Ver en el tema ${g[2]}</a><button class="btn ${S.known[g[0]]?'ghost':'acc'}" data-k>${S.known[g[0]]?'Volver a repasar':'Ya la sé'}</button></span></div>`;
    $('.flash').onclick=()=>{flip=!flip;draw()};
    $('[data-p]').onclick=()=>{i=(i-1+list.length)%list.length;flip=false;draw()};
    $('[data-n]').onclick=()=>{i=(i+1)%list.length;flip=false;draw()};
    $('[data-k]').onclick=()=>{S.known[g[0]]=!S.known[g[0]];save();flip=false;if(!pend&&S.known[g[0]])i=(i+1)%list.length;draw()};
    $('#fc-p').onchange=e=>{pend=e.target.checked;i=0;flip=false;draw()};
  };draw();
}
function vQuiz(){
  let eje=0;
  main.innerHTML=`<div class="wrap"><p class="eyebrow">Practicar</p><h1>Autoevaluación</h1><p class="lead">Diez preguntas de opción múltiple al azar, con explicación. Elegí toda la materia o una sola parte.</p><div class="seg" id="qe"><button data-e="0" aria-pressed="true">Toda la materia</button>${UN.map(i=>`<button data-e="${i}" aria-pressed="false">${U[i].n}</button>`).join('')}</div><div id="qz"></div></div>`;
  const start=()=>{
    const pool=shuffle(TOPICS.filter(t=>!eje||t.eje===eje).flatMap(t=>t.quiz.map(q=>({...q,t})))).slice(0,10);let i=0,ok=0;const miss=new Set();
    const next=()=>{
      const z=$('#qz');
      if(i>=pool.length){ if(!eje&&ok>S.best){S.best=ok;save()}
        z.innerHTML=`<div class="card"><p class="eyebrow">Resultado</p><p class="big">${ok} de ${pool.length}</p><p>${ok>=pool.length*.9?'Muy bien. Pasá al simulador oral.':ok>=pool.length*.6?'Vas bien. Repasá los temas donde fallaste.':'Todavía falta. Volvé a los temas y probá de nuevo.'}</p>${miss.size?`<p class="links"><span>Para repasar</span>${[...miss].map(n=>`<a href="#tema-${n}">${byN(n).short}</a>`).join('')}</p>`:''}<p><button class="btn acc" data-again>Otras 10 preguntas</button></p></div>`;
        $('[data-again]').onclick=start;return}
      const q=pool[i];z.innerHTML=`<div class="row"><span>Pregunta ${i+1} de ${pool.length}</span><span class="pill ok">${ok} correctas</span><span class="sp chip">Tema ${q.t.n} · ${q.t.short}</span></div>`;
      z.className='eje-'+q.t.eje;
      z.appendChild(qCard(q,i+1,(good,card)=>{if(good)ok++;else miss.add(q.t.n);const b=document.createElement('button');b.className='btn';b.textContent=i+1<pool.length?'Siguiente':'Ver resultado';b.onclick=()=>{i++;next()};card.appendChild(b);b.focus()}));
    };next();
  };
  $$('#qe button').forEach(b=>b.onclick=()=>{eje=+b.dataset.e;$$('#qe button').forEach(x=>x.setAttribute('aria-pressed',x===b));start()});start();
}
function vOral(){
  let un=0,pend=false,cur=-1;
  const bu=[...new Set(BANK.map(b=>b[0]))];
  main.innerHTML=`<div class="wrap"><p class="eyebrow">Practicar</p><h1>Simulador oral</h1><p class="lead">${SITE.oralIntro}</p>
  <div class="seg" id="ou"><button data-e="0" aria-pressed="true">Todas</button>${bu.map(i=>`<button data-e="${i}" aria-pressed="false">${U[i].n}</button>`).join('')}</div>
  <div class="row"><button class="btn acc" id="ask">Sacar una pregunta</button><label style="display:flex;gap:8px;align-items:center;font-size:.9rem"><input type="checkbox" id="op"> Solo las que me faltan</label><span class="sp pill ok" id="oc"></span></div><div id="oq"></div>
  <h2>Todas las preguntas de la guía</h2><p>Tocá una pregunta para ver la respuesta propuesta. Son respuestas de estudio, no las oficiales del profesor.</p><div id="ol"></div></div>`;
  const cnt=()=>$('#oc').textContent=`${oralCount()} de ${BANK.length} sabidas`;
  const list=()=>{$('#ol').innerHTML=bu.filter(u=>!un||u===un).map(u=>`<div class="eje-${u}"><h3>${U[u].n} · ${U[u].t}</h3>${BANK.map((b,i)=>b[0]===u?`<details><summary>${S.oral[i]?'<span class="pill ok">Sabida</span> ':''}${b[1]}</summary><p class="say">${b[2]}</p>${b[4]?`<p><b>Posible repregunta:</b> ${b[4]}</p>`:''}<p><a href="#tema-${b[3]}">Repasar el tema ${b[3]}: ${byN(b[3]).short}</a></p></details>`:'').join('')}</div>`).join('')};
  const show=i=>{cur=i;const b=BANK[i],t=byN(b[3]);
    $('#oq').innerHTML=`<div class="card eje-${b[0]}"><p class="eyebrow">${U[b[0]].n} · ${t.short}</p><p class="oral-q">${b[1]}</p><div data-t></div><details><summary>Ver la respuesta modelo</summary><p class="say">${b[2]}</p>${b[4]?`<p><b>Posible repregunta:</b> ${b[4]}</p>`:''}<p><a href="#tema-${t.n}">Repasar el tema ${t.n}</a></p></details><div class="row"><button class="btn ${S.oral[i]?'ghost':'acc'}" data-k>${S.oral[i]?'Volver a repasar':'La respondí bien'}</button><button class="btn" data-nx>Otra pregunta</button></div></div>`;
    timer($('[data-t]',$('#oq')),SITE.secs);
    $('[data-k]').onclick=()=>{S.oral[i]=!S.oral[i];save();cnt();list();show(i)};$('[data-nx]').onclick=ask};
  const ask=()=>{ticks.forEach(clearInterval);ticks=[];let pool=BANK.map((b,i)=>i).filter(i=>(!un||BANK[i][0]===un)&&(!pend||!S.oral[i])&&i!==cur);
    if(!pool.length){$('#oq').innerHTML=`<div class="card"><p class="big">No quedan preguntas pendientes acá.</p><p>Destildá "Solo las que me faltan" o elegí otra parte.</p></div>`;cur=-1;return}
    show(pool[Math.floor(Math.random()*pool.length)])};
  $('#ask').onclick=ask;$('#op').onchange=e=>pend=e.target.checked;
  $$('#ou button').forEach(b=>b.onclick=()=>{un=+b.dataset.e;$$('#ou button').forEach(x=>x.setAttribute('aria-pressed',x===b));list()});
  cnt();list();
}
function vFormulas(){
  main.innerHTML=`<div class="wrap"><p class="eyebrow">Practicar</p><h1>Fórmulas clave</h1><p class="lead">Una hoja para repasar antes de entrar. Tapá la columna del medio y tratá de decir cada fórmula.</p>${FORMULAS.map(g=>`<div class="eje-${g[0]}"><h3>${U[g[0]].n} · ${U[g[0]].t}</h3>${T(['Concepto','Fórmula','Para qué sirve'],g[1])}</div>`).join('')}</div>`;
}
function vGlosario(){
  main.innerHTML=`<div class="wrap"><p class="eyebrow">Practicar</p><h1>Glosario</h1><p class="lead">${GLOS.length} términos de la materia.</p><label for="gs" style="font-weight:600;font-size:.85rem;color:var(--muted)">Buscar un término</label><input class="search" id="gs" type="search" placeholder="${SITE.glosEj}"><dl class="glos" id="gl"></dl></div>`;
  const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const draw=()=>{const k=norm($('#gs').value),l=[...GLOS].sort((a,b)=>a[0].localeCompare(b[0],'es')).filter(g=>norm(g[0]+' '+g[1]).includes(k));
    $('#gl').innerHTML=l.length?l.map(g=>`<div class="eje-${byN(g[2]).eje}"><dt>${g[0]}</dt><dd>${g[1]} <a href="#tema-${g[2]}">Tema ${g[2]} →</a></dd></div>`).join(''):'<p>No hay términos con esa búsqueda. Probá con otra palabra.</p>'};
  $('#gs').oninput=draw;draw();
}
function route(){
  ticks.forEach(clearInterval);ticks=[];
  let h=(location.hash||'#inicio').slice(1);const m=h.match(/^tema-(\d+)$/);
  if(m&&byN(+m[1]))vTema(+m[1]);
  else if(h==='tarjetas')vTarjetas();else if(h==='quiz')vQuiz();else if(h==='oral')vOral();else if(h==='glosario')vGlosario();
  else if(h==='formulas'&&typeof FORMULAS!=='undefined')vFormulas();
  else{h='inicio';vInicio()}
  renderSide(h);side.classList.remove('open');window.scrollTo(0,0);
}
$('#menu').onclick=()=>side.classList.toggle('open');
$('#scrim').onclick=()=>side.classList.remove('open');
window.addEventListener('hashchange',route);route();

</script></body></html>
