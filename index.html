<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estadística y Exploración de Datos II para el coloquio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: índice lateral fijo + columna de lectura de 780px; cada tema lleva el color de su eje */
  --bg:#f1f5f3; --surface:#ffffff; --surface-2:#e7eeea; --ink:#15272b; --muted:#55696d; --line:#d3deda;
  --accent:#f4b81a; --accent-ink:#3a2c00;
  --e1:#0b7a6a; --e2:#3355cc; --e3:#c23a62; --e4:#7a4fc0; --e5:#a85608; --e6:#55696d; --hb:#15272b; --hf:#f1f5f3; --s1:#3355cc; --s2:#c2540a; --s3:#06906f;
  --good:#17804a; --warn:#a86400; --bad:#c2392b;
  --fd:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --fb:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px; --ej:var(--e1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f181b; --surface:#172327; --surface-2:#1f2f34; --ink:#e5eeee; --muted:#9bb0b3; --line:#2d3f45;
  --accent:#ffd04a; --accent-ink:#2b2000;
  --e1:#46caae; --e2:#93aaff; --e3:#ff8eaa; --e4:#c3a6ff; --e5:#ffb066; --e6:#9bb0b3; --hb:#22363c; --hf:#e5eeee; --s1:#6b84e6; --s2:#d07a2c; --s3:#1fa98c;
  --good:#4fd08c; --warn:#f2b450; --bad:#ff8172; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f181b; --surface:#172327; --surface-2:#1f2f34; --ink:#e5eeee; --muted:#9bb0b3; --line:#2d3f45;
  --accent:#ffd04a; --accent-ink:#2b2000;
  --e1:#46caae; --e2:#93aaff; --e3:#ff8eaa; --e4:#c3a6ff; --e5:#ffb066; --e6:#9bb0b3; --hb:#22363c; --hf:#e5eeee; --s1:#6b84e6; --s2:#d07a2c; --s3:#1fa98c;
  --good:#4fd08c; --warn:#f2b450; --bad:#ff8172; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--fb);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--fd);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.9rem,4.5vw,2.7rem);font-weight:700;letter-spacing:-.02em}
h2{font-size:1.45rem;font-weight:700;margin-top:2.2rem}
h3{font-size:1.2rem;font-weight:700;margin:2.2rem 0 .7rem}
p{margin:.7rem 0}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.eje-1{--ej:var(--e1)}.eje-2{--ej:var(--e2)}.eje-3{--ej:var(--e3)}

/* estructura */
.app{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:22px 16px 30px}
.brand{display:block;text-decoration:none;font:700 1.25rem/1.1 var(--fd);letter-spacing:-.01em;padding:0 8px}
.brand small{display:block;font:500 .8rem var(--fb);color:var(--muted);margin-top:4px;letter-spacing:0}
.prog{margin:16px 8px 6px}
.prog-bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.prog small{color:var(--muted);font-size:.8rem}
.nav h4{font:600 .72rem var(--fb);text-transform:uppercase;letter-spacing:.08em;color:var(--ej,var(--muted));margin:20px 8px 6px}
.nav a{display:flex;gap:9px;align-items:baseline;padding:6px 8px;border-radius:9px;text-decoration:none;font-size:.92rem;line-height:1.3}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:color-mix(in srgb,var(--ej,var(--accent)) 16%,var(--surface));font-weight:600}
.nav a .num{flex:none;width:1.5em;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem}
.nav a .ck{margin-left:auto;flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line);align-self:center}
.nav a.done .ck{background:var(--good);border-color:var(--good)}
.top,.scrim{display:none}
main{padding:36px clamp(16px,4vw,56px) 80px;min-width:0}
.wrap{max-width:780px;margin:0 auto}
.wrap.wide{max-width:1040px}
@media (max-width:900px){
  .app{display:block}
  .top{display:flex;position:sticky;top:0;z-index:20;align-items:center;gap:12px;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px}
  .top b{font-family:var(--fd)}
  .side{position:fixed;z-index:30;left:0;top:0;width:min(310px,88vw);transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.35)}
  .side.open~.scrim{display:block}
  main{padding-top:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* piezas */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.95rem;text-decoration:none}
.btn:hover{filter:brightness(1.15)}
.btn.acc{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.sm{padding:6px 12px;font-size:.85rem}
.btn:disabled{cursor:default;opacity:.75;filter:none}
.btn.right{background:var(--good);color:#fff;box-shadow:none;opacity:1}
.btn.wrong{background:var(--bad);color:#fff;box-shadow:none;opacity:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.eyebrow{font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ej)}
.lead{font-size:1.15rem;color:var(--muted);margin:.6rem 0 1.4rem;max-width:62ch}
.def{background:color-mix(in srgb,var(--ej) 10%,var(--surface));border-left:5px solid var(--ej);border-radius:0 var(--r) var(--r) 0;padding:14px 18px;font-size:1.06rem}
.note{background:var(--surface-2);border-radius:var(--r);padding:12px 16px;font-size:.95rem}
.tag{display:inline-block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:1px 7px;vertical-align:.1em}
.template{font-family:var(--fd);font-size:1.1rem;background:var(--surface);border:1.5px dashed var(--ej);border-radius:var(--r);padding:16px 18px}
.template i{color:var(--ej);font-style:normal;font-weight:700}
.g2,.g3{display:grid;gap:12px;margin:1rem 0}
.g2{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.mini{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--ej);border-radius:var(--r);padding:12px 16px}
.mini b{font-family:var(--fd);font-size:1.05rem}
.mini p{margin:.3rem 0 0;font-size:.93rem;color:var(--muted)}
.mini.warn{border-top-color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:.8rem 0}
.chips span,.chip{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:.88rem}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:1rem 0;counter-reset:f}
.flow>div{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.flow small{font-weight:700;color:var(--ej)}
.flow b{font-family:var(--fd);line-height:1.2}
.flow span{font-size:.86rem;color:var(--muted)}
.flow.sm{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.flow.sm>div:not(:last-child)::after{content:"→";position:absolute;right:-11px;top:50%;transform:translateY(-50%);color:var(--ej);font-weight:700;z-index:1}
.tw{overflow-x:auto;margin:1rem 0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{background:color-mix(in srgb,var(--ej) 12%,var(--surface));font-weight:700;white-space:nowrap}
tbody th{font-weight:600;min-width:120px}
tbody tr:last-child>*{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:center;font:500 1.2rem var(--fd);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:1rem 0}
.frac{display:inline-flex;flex-direction:column;text-align:center}
.frac span:first-child{border-bottom:2px solid var(--ink);padding:0 8px 3px}
.frac span:last-child{padding:3px 8px 0}

/* widgets */
.w{margin:1.2rem 0}
.box{background:var(--surface);border:1.5px solid color-mix(in srgb,var(--ej) 45%,var(--line));border-radius:var(--r);padding:18px 20px}
.box-t{font:700 1rem var(--fd);margin:0 0 .6rem;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.box-t .count{font:500 .82rem var(--fb);color:var(--muted)}
.box-t em{font:600 .7rem var(--fb);font-style:normal;text-transform:uppercase;letter-spacing:.08em;color:var(--ej)}
.stmt{font-size:1.12rem;font-weight:500;margin:.4rem 0 1rem;min-height:3.2em}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.fb{margin:.8rem 0 0;font-size:.95rem;min-height:1.5em}
.fb .btn{margin-left:8px}
.big{font:700 2rem var(--fd);margin:.3rem 0 1rem}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px;align-items:end}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted)}
.fields input,.fields select,.search{background:var(--bg);border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;color:var(--ink)}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
.res div{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.res small{display:block;color:var(--muted);font-size:.78rem;font-weight:600}
.res b{font:700 1.3rem var(--fd);font-variant-numeric:tabular-nums}
.res .ok b{color:var(--good)}.res .no b{color:var(--bad)}
.verdict{font-weight:600}
svg{max-width:100%;height:auto;display:block}
svg text{font-family:var(--fb);fill:var(--ink)}
.scroll{overflow-x:auto}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--ej);border-color:var(--ej);color:var(--surface)}
.detail{background:var(--surface-2);border-radius:10px;padding:12px 14px;margin-top:12px;font-size:.96rem}
.detail b{font-family:var(--fd)}
input[type=range]{width:100%;accent-color:var(--ej)}

.foda{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.foda div{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.9rem;transition:opacity .2s}
.foda b{font-family:var(--fd);display:block}
.foda small{color:var(--muted);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.foda ul{margin:.3rem 0 0;padding-left:1.1em}
.foda .dim{opacity:.35}
.foda .hit{border-color:var(--ej);background:color-mix(in srgb,var(--ej) 10%,var(--surface))}
@media (max-width:520px){.foda{grid-template-columns:1fr}}

.canvas{display:grid;gap:6px;grid-template-columns:repeat(10,1fr);grid-template-areas:"so so ac ac pv pv re re se se" "so so rc rc pv pv ca ca se se" "co co co co co in in in in in"}
.canvas button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;min-height:86px;text-align:left;cursor:pointer;font:700 .88rem/1.2 var(--fd);display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.canvas button small{font:500 .74rem var(--fb);color:var(--muted)}
.canvas button[aria-pressed="true"]{background:var(--ej);border-color:var(--ej);color:var(--surface)}
.canvas button[aria-pressed="true"] small{color:inherit;opacity:.85}
@media (max-width:640px){.canvas{grid-template-columns:1fr 1fr;grid-template-areas:"se pv" "ca re" "in in" "rc ac" "so so" "co co"}}

.tree{font-size:.9rem}
.tree .root{background:var(--ej);color:var(--surface);border-radius:10px;padding:8px 14px;font:700 1rem var(--fd);text-align:center;margin-bottom:10px}
.tree .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px}
.tree .col>b{display:block;background:color-mix(in srgb,var(--ej) 18%,var(--surface));border-radius:8px;padding:6px 10px;font-family:var(--fd)}
.tree .col span{display:block;border:1px solid var(--line);border-radius:8px;padding:4px 10px;margin:5px 0 0 12px;font-size:.84rem}

.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{flex:1 1 110px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 8px;cursor:pointer;font:700 .9rem var(--fd)}
.steps button small{display:block;font:600 .7rem var(--fb);color:var(--muted)}
.steps button[aria-pressed="true"]{background:var(--ej);border-color:var(--ej);color:var(--surface)}
.steps button[aria-pressed="true"] small{color:inherit}
.band{margin-top:6px;border:1.5px dashed var(--ej);border-radius:10px;text-align:center;padding:5px;font-size:.84rem;font-weight:600;color:var(--ej)}
.meter{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:6px 0 2px}
.meter i{display:block;height:100%;background:var(--ej);transition:width .25s}

.matrix{display:grid;grid-template-columns:auto repeat(3,1fr);gap:5px;font-size:.84rem}
.matrix .ax{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted);padding:4px 8px}
.matrix .cell{min-height:64px;border-radius:9px;padding:6px;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start}
.lv1{background:color-mix(in srgb,var(--good) 20%,var(--surface))}
.lv2{background:color-mix(in srgb,var(--warn) 24%,var(--surface))}
.lv3{background:color-mix(in srgb,var(--bad) 24%,var(--surface))}
.matrix .cell button{border:0;background:var(--ink);color:var(--bg);border-radius:7px;padding:3px 9px;font-weight:700;cursor:pointer;font-size:.82rem}
.matrix .cell button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pill{display:inline-block;border-radius:99px;padding:1px 10px;font-size:.8rem;font-weight:700}
.pill.ok{background:color-mix(in srgb,var(--good) 20%,var(--surface));color:var(--good)}
.pill.wa{background:color-mix(in srgb,var(--warn) 24%,var(--surface));color:var(--warn)}
.pill.no{background:color-mix(in srgb,var(--bad) 22%,var(--surface));color:var(--bad)}
.raci td.c{text-align:center;font-weight:700}
.raci .R{color:var(--e2)}.raci .A{color:var(--e3)}.raci .C{color:var(--e1)}.raci .I{color:var(--muted)}
.check{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.check label{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:9px;padding:8px 12px;cursor:pointer}
.check input{margin-top:.35em;accent-color:var(--good);width:17px;height:17px;flex:none}

/* coloquio, quiz, tarjetas */
.coloquio{margin:2.4rem 0 1rem;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:20px 22px}
.coloquio small{font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.74rem;color:var(--accent)}
.coloquio p{font:500 1.18rem/1.4 var(--fd);margin:.4rem 0 0}
.links{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
.links a{text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 12px}
.links a:hover{border-color:var(--ej)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:12px 0}
.q-t{font-weight:600;margin:0 0 10px;display:flex;gap:10px}
.q-n{flex:none;width:1.7em;height:1.7em;border-radius:50%;background:var(--ej);color:var(--surface);display:grid;place-items:center;font-size:.82rem;font-weight:700}
.q-o{display:grid;gap:7px}
.q-o button{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 13px;cursor:pointer}
.q-o button:hover:not(:disabled){border-color:var(--ej)}
.q-o button.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--surface));font-weight:600}
.q-o button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.q-o button:disabled{cursor:default}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:2.4rem;padding-top:1.4rem;border-top:1px solid var(--line)}
.flash{min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;cursor:pointer;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:20px;padding:28px}
.flash .term{font:700 clamp(1.5rem,4vw,2.1rem)/1.15 var(--fd);text-wrap:balance}
.flash .back{font-size:1.1rem;max-width:52ch}
.flash small{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
.row .sp{margin-left:auto}
.clock{font:700 3.2rem/1 var(--fd);font-variant-numeric:tabular-nums}
.clock.end{color:var(--bad)}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;margin:10px 0}
.picks label{display:flex;gap:8px;align-items:baseline;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;font-size:.88rem;cursor:pointer}
.picks label:has(input:checked){border-color:var(--ej);background:color-mix(in srgb,var(--ej) 12%,var(--surface));font-weight:600}
.picks input{accent-color:var(--ej)}
details{background:var(--surface-2);border-radius:10px;padding:10px 14px;margin:8px 0}
summary{cursor:pointer;font-weight:600}
dl.glos{margin:0}
dl.glos div{padding:12px 0;border-bottom:1px solid var(--line)}
dl.glos dt{font:700 1.05rem var(--fd)}
dl.glos dd{margin:.2rem 0 0;color:var(--muted)}
dl.glos a{font-size:.82rem;color:var(--ej);font-weight:600;text-decoration:none}

/* inicio */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(240px,1fr);gap:20px;align-items:stretch}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.exam{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:20px 22px}
.exam h2{margin:0 0 .6rem;font-size:1.15rem;color:var(--accent)}
.exam .t{display:flex;gap:12px;align-items:baseline;margin:.5rem 0}
.exam .t>b{font:700 1.7rem var(--fd);flex:none;width:2.6em}
.exam .t span{font-size:.93rem}
.ejes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:1rem}
.ejecard{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--ej);border-radius:var(--r);padding:16px 16px 10px}
.ejecard h3{margin:0;font-size:1.15rem}
.ejecard>p{margin:.2rem 0 .7rem;font-size:.88rem;color:var(--muted)}
.ejecard a{display:flex;gap:9px;align-items:baseline;text-decoration:none;padding:6px 8px;margin:0 -8px;border-radius:8px;font-size:.93rem;line-height:1.3}
.ejecard a:hover{background:var(--surface-2)}
.ejecard a .num{font-weight:700;color:var(--ej);width:1.5em;flex:none;font-variant-numeric:tabular-nums}
.ejecard a .ck{margin-left:auto;font-size:.74rem;font-weight:700;color:var(--good);flex:none}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:1rem}

/* añadidos: más unidades, gráficos y simulador oral */
.eje-4{--ej:var(--e4)}.eje-5{--ej:var(--e5)}.eje-6{--ej:var(--e6)}
svg .ax{stroke:var(--muted);stroke-width:1;fill:none}
svg .gr{stroke:var(--line);stroke-width:1}
svg .l1{stroke:var(--s1);stroke-width:2.5;fill:none}
svg .l2{stroke:var(--s2);stroke-width:2.5;fill:none}

svg .a1{fill:var(--s1);opacity:.25}.a2{fill:var(--s2);opacity:.25}
svg .b1{fill:var(--s1)}svg .b2{fill:var(--s2)}svg .bm{fill:var(--line)}
svg .d1{fill:var(--s1);stroke:var(--surface);stroke-width:1.5}
svg .d2{fill:var(--s2);stroke:var(--surface);stroke-width:1.5}

svg .dk{fill:var(--ink);stroke:var(--surface);stroke-width:2}
svg .th{stroke:var(--ink);stroke-width:2;stroke-dasharray:6 4;fill:none}

svg text{font-size:12px}
svg text.mu{fill:var(--muted)}

.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin:.3rem 0}

pre{background:var(--surface-2);border-radius:10px;padding:12px 14px;overflow-x:auto;font:500 .84rem/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin:1rem 0}

<body>
<div class="app">
  <aside class="side" id="side" aria-label="Índice de la materia"></aside>
  <div class="scrim" id="scrim"></div>
  <div>
    <div class="top"><button class="btn ghost sm" id="menu" aria-controls="side">Índice</button><b>Estadística II</b></div>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const fmt=(n,d=2)=>Number(n).toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(n,d=1)=>isFinite(n)?fmt(n*100,d)+' %':'—';
const T=(h,r)=>`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.map(x=>`<tr>${x.map((c,i)=>i?`<td>${c}</td>`:`<th scope="row">${c}</th>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const W=n=>`<div class="w" data-w="${n}"></div>`;
const L=a=>`<ul>${a.map(i=>`<li>${i}</li>`).join('')}</ul>`;
const O=a=>`<ol>${a.map(i=>`<li>${i}</li>`).join('')}</ol>`;
const D=t=>`<p class="def">${t}</p>`;
const EJ=`<span class="tag">Ejemplo</span> `;
const TRAP=t=>`<p class="trap"><b>Error frecuente.</b> ${t}</p>`;
const MINI=a=>`<div class="g2">${a.map(m=>`<div class="mini"><b>${m[0]}</b><p>${m[1]}</p></div>`).join('')}</div>`;
const FLOW=(a,sm)=>`<div class="flow${sm?' sm':''}">${a.map((s,i)=>`<div>${sm?'':`<small>${i+1}</small>`}<b>${s[0]}</b><span>${s[1]||''}</span></div>`).join('')}</div>`;
const F=t=>`<div class="formula"><span>${t}</span></div>`;
const FR=(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const CODE=t=>`<pre><code>${t.replace(/</g,'&lt;')}</code></pre>`;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const box=(title,body,tag='Interactivo')=>`<div class="box"><p class="box-t"><span>${title}</span><em>${tag}</em></p>${body}</div>`;
const res=a=>`<div class="res">${a.map(r=>`<div class="${r[2]||''}"><small>${r[0]}</small><b>${r[1]}</b></div>`).join('')}</div>`;
const legend=a=>`<p class="legend">${a.map(l=>`<span><i style="background:var(--${l[0]})"></i>${l[1]}</span>`).join('')}</p>`;

/* matemática */
const erf=x=>{const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+.3275911*x);return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x))};
const Phi=z=>.5*(1+erf(z/Math.SQRT2));
const npdf=(x,m=0,s=1)=>Math.exp(-.5*((x-m)/s)**2)/(s*Math.sqrt(2*Math.PI));
const bisect=(f,a,b)=>{for(let i=0;i<60;i++){const m=(a+b)/2;f(m)>0?b=m:a=m}return (a+b)/2};
const invPhi=p=>bisect(z=>Phi(z)-p,-8,8);
const lgam=x=>{const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,.001208650973866179,-.000005395239384953];let y=x,t=x+5.5;t-=(x+.5)*Math.log(t);let s=1.000000000190015;for(const k of c)s+=k/++y;return -t+Math.log(2.5066282746310005*s/x)};
const tpdf=(t,v)=>Math.exp(lgam((v+1)/2)-lgam(v/2))/Math.sqrt(v*Math.PI)*(1+t*t/v)**(-(v+1)/2);
const tcdf=(t,v)=>{const n=400,h=Math.abs(t)/n;let s=tpdf(0,v)+tpdf(Math.abs(t),v);for(let i=1;i<n;i++)s+=(i%2?4:2)*tpdf(i*h,v);const a=s*h/3;return t>=0?.5+a:.5-a};
const rng=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const gauss=r=>Math.sqrt(-2*Math.log(r()||1e-9))*Math.cos(2*Math.PI*r());
const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;
const sd=a=>{const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1))};
const median=a=>{const s=[...a].sort((x,y)=>x-y),h=s.length>>1;return s.length%2?s[h]:(s[h-1]+s[h])/2};
const comb=(n,k)=>{let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return r};

/* gráfico SVG mínimo */
function plot(o){
  const Wd=Math.min(o.w||560,innerWidth<600?360:9999),H=o.h||260,tf=t=>String(t).replace('.',','),m={l:o.yl?52:40,r:14,t:14,b:o.xl?42:26};
  const sx=v=>m.l+(v-o.x[0])/(o.x[1]-o.x[0])*(Wd-m.l-m.r),sy=v=>H-m.b-(v-o.y[0])/(o.y[1]-o.y[0])*(H-m.t-m.b);
  let s='';
  (o.yt||[]).forEach(t=>s+=`<line class="gr" x1="${m.l}" x2="${Wd-m.r}" y1="${sy(t)}" y2="${sy(t)}"/><text class="mu" x="${m.l-6}" y="${sy(t)+4}" text-anchor="end">${o.yf?o.yf(t):tf(t)}</text>`);
  (o.xt||[]).forEach(t=>s+=`<text class="mu" x="${sx(t)}" y="${H-m.b+16}" text-anchor="middle">${o.xf?o.xf(t):tf(t)}</text>`);
  s+=`<path class="ax" d="M${m.l} ${m.t}V${H-m.b}H${Wd-m.r}"/>`;
  if(o.xl)s+=`<text class="mu" x="${(m.l+Wd-m.r)/2}" y="${H-6}" text-anchor="middle">${o.xl}</text>`;
  if(o.yl)s+=`<text class="mu" transform="translate(13 ${(m.t+H-m.b)/2}) rotate(-90)" text-anchor="middle">${o.yl}</text>`;
  const P={sx,sy,
    path(pts,c){s+=`<path class="${c}" d="${pts.map((p,i)=>(i?'L':'M')+sx(p[0]).toFixed(1)+' '+sy(p[1]).toFixed(1)).join('')}"/>`;return P},
    fn(f,c,a=o.x[0],b=o.x[1],n=120){return P.path(Array.from({length:n+1},(_,i)=>{const x=a+(b-a)*i/n;return[x,f(x)]}),c)},
    area(f,c,a,b,n=80){const pts=Array.from({length:n+1},(_,i)=>{const x=a+(b-a)*i/n;return[x,f(x)]});s+=`<path class="${c}" d="M${sx(a)} ${sy(o.y[0])}${pts.map(p=>'L'+sx(p[0]).toFixed(1)+' '+sy(p[1]).toFixed(1)).join('')}L${sx(b)} ${sy(o.y[0])}Z"/>`;return P},
    dot(x,y,c,r=5,t){s+=`<circle class="${c}" cx="${sx(x)}" cy="${sy(y)}" r="${r}">${t?`<title>${t}</title>`:''}</circle>`;return P},
    seg(x1,y1,x2,y2,c){s+=`<line class="${c}" x1="${sx(x1)}" y1="${sy(y1)}" x2="${sx(x2)}" y2="${sy(y2)}"/>`;return P},
    v(x,c,t){s+=`<line class="${c}" x1="${sx(x)}" x2="${sx(x)}" y1="${m.t}" y2="${H-m.b}"/>`;if(t)P.text(x,o.y[1],t,sx(x)>Wd*.7?'end':'start',sx(x)>Wd*.7?-6:6,10,'bd');return P},
    bar(x,w,y,c,t){const y0=sy(Math.max(o.y[0],0)),y1=sy(y);s+=`<rect class="${c}" x="${sx(x-w/2)+1}" width="${Math.max(1,sx(x+w/2)-sx(x-w/2)-2)}" y="${Math.min(y0,y1)}" height="${Math.abs(y0-y1)}" rx="2">${t?`<title>${t}</title>`:''}</rect>`;return P},
    text(x,y,t,anc='start',dx=0,dy=0,c=''){s+=`<text class="${c}" x="${sx(x)+dx}" y="${sy(y)+dy}" text-anchor="${anc}">${t}</text>`;return P},
    raw(t){s+=t;return P},
    svg(aria){return `<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="${aria}">${s}</svg>`}};
  return P;
}

/* controles: [id, etiqueta, min, max, paso, valor, formato, 'n' si es numérico] */
function ui(el,title,ctrls,draw,tag,after){
  el.innerHTML=box(title,`<div class="fields">${ctrls.map(c=>c[7]==='n'?`<label><span>${c[1]}</span><input type="number" data-s="${c[0]}" min="${c[2]}" max="${c[3]}" step="${c[4]}" value="${c[5]}"></label>`:`<label><span>${c[1]}: <b data-o="${c[0]}"></b></span><input type="range" data-s="${c[0]}" min="${c[2]}" max="${c[3]}" step="${c[4]}" value="${c[5]}"></label>`).join('')}</div><div data-out aria-live="off"></div>`,tag);
  const out=$('[data-out]',el);
  const run=()=>{const v={};ctrls.forEach(c=>{const inp=$(`[data-s="${c[0]}"]`,el);let x=parseFloat(inp.value);if(!isFinite(x))x=c[5];x=Math.min(c[3],Math.max(c[2],x));v[c[0]]=x;const o=$(`[data-o="${c[0]}"]`,el);if(o)o.textContent=c[6]?c[6](x):fmt(x,((c[4]+'').split('.')[1]||'').length)});out.innerHTML=draw(v);after&&after(el,run)};
  $$('input',el).forEach(i=>i.oninput=run);run();return run;
}

/* juego de clasificar */
function sorter(el,title,cats,items){
  let i=0,ok=0,order=shuffle(items);
  const draw=()=>{
    if(i>=order.length){
      el.innerHTML=box(title,`<p class="big">${ok} de ${order.length} correctas</p><button class="btn" data-r>Jugar de nuevo</button>`,'Práctica');
      $('[data-r]',el).onclick=()=>{i=0;ok=0;order=shuffle(items);draw()};return}
    const it=order[i];
    el.innerHTML=box(`${title} <span class="count">${i+1} de ${order.length}</span>`,`<p class="stmt">${it[0]}</p><div class="opts">${cats.map((c,k)=>`<button class="btn ghost" data-k="${k}">${c}</button>`).join('')}</div><p class="fb" aria-live="polite"></p>`,'Práctica');
    $$('[data-k]',el).forEach(b=>b.onclick=()=>{
      const good=+b.dataset.k===it[1]; if(good)ok++;
      $$('[data-k]',el).forEach(x=>{x.disabled=true;if(+x.dataset.k===it[1])x.classList.add('right')});
      if(!good)b.classList.add('wrong');
      $('.fb',el).innerHTML=`<strong>${good?'Correcto.':'No.'}</strong> ${it[2]||''} <button class="btn sm" data-n>${i+1<order.length?'Siguiente':'Ver resultado'}</button>`;
      $('[data-n]',el).onclick=()=>{i++;draw()};
    });
  };draw();
}
function qCard(q,idx,onAns){
  const d=document.createElement('div');d.className='q';
  d.innerHTML=`<p class="q-t"><span class="q-n">${idx}</span><span>${q.q}</span></p><div class="q-o">${q.o.map((o,k)=>`<button data-k="${k}">${o}</button>`).join('')}</div><p class="fb" aria-live="polite"></p>`;
  $$('.q-o button',d).forEach(b=>b.onclick=()=>{
    const good=+b.dataset.k===q.a;
    $$('.q-o button',d).forEach(x=>{x.disabled=true;if(+x.dataset.k===q.a)x.classList.add('right')});
    if(!good)b.classList.add('wrong');
    $('.fb',d).innerHTML=`<strong>${good?'Correcto.':'Incorrecto.'}</strong> ${q.e}`;
    onAns&&onAns(good,d);
  });
  return d;
}
function picker(el,title,items,cls='seg',extra=''){
  el.innerHTML=box(title,`<div class="${cls}">${items.map((it,i)=>`<button data-i="${i}" aria-pressed="${i===0}">${it.b}</button>`).join('')}</div>${extra}<div class="detail" aria-live="polite"></div>`);
  const show=i=>{$$('[data-i]',el).forEach(b=>b.setAttribute('aria-pressed',+b.dataset.i===i));$('.detail',el).innerHTML=typeof items[i].d==='function'?items[i].d():items[i].d};
  $$('[data-i]',el).forEach(b=>b.onclick=()=>show(+b.dataset.i));show(0);
}
let ticks=[];
function timer(el,secs){
  let left=secs,id=null;
  const mmss=()=>`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
  el.innerHTML=`<div class="row"><span class="clock">${mmss()}</span><button class="btn acc" data-go>Empezar</button><button class="btn ghost" data-re>Reiniciar</button></div>`;
  const clock=$('.clock',el),go=$('[data-go]',el);
  const stop=()=>{clearInterval(id);id=null;go.textContent=left===secs?'Empezar':'Seguir'};
  go.onclick=()=>{ if(id){stop();return} if(left===0)return;
    go.textContent='Pausar';
    id=setInterval(()=>{left--;clock.textContent=mmss(); if(left<=0){stop();clock.classList.add('end');go.textContent='Tiempo'}},1000); ticks.push(id)};
  $('[data-re]',el).onclick=()=>{stop();left=secs;clock.textContent=mmss();clock.classList.remove('end');go.textContent='Empezar'};
}

/* modelo de clasificador para los gráficos de umbral: puntajes de negativos ~N(.35,.15) y de positivos ~N(.62,.15) */
const CL={mn:.35,mp:.62,s:.15,N:1000};
const clf=(t,prev)=>{const tpr=1-Phi((t-CL.mp)/CL.s),fpr=1-Phi((t-CL.mn)/CL.s),P=Math.round(CL.N*prev),Ng=CL.N-P,VP=Math.round(P*tpr),FP=Math.round(Ng*fpr);return{tpr,fpr,VP,FN:P-VP,FP,VN:Ng-FP}};
const metrics=({VP,FP,FN,VN})=>{const n=VP+FP+FN+VN,pr=VP/(VP+FP),re=VP/(VP+FN),sp=VN/(VN+FP);return{acc:(VP+VN)/n,pr,re,sp,f1:2*pr*re/(pr+re),j:re+sp-1}};
const cmHTML=c=>`<div class="cm"><div></div><div class="h">Predijo negativo</div><div class="h">Predijo positivo</div><div class="h">Real negativo</div><div class="ok"><b>${c.VN}</b>VN · acierto</div><div class="ko"><b>${c.FP}</b>FP · falsa alarma</div><div class="h">Real positivo</div><div class="ko"><b>${c.FN}</b>FN · omisión</div><div class="ok"><b>${c.VP}</b>VP · acierto</div></div>`;
const metHTML=m=>res([['Accuracy',pct(m.acc)],['Precision',pct(m.pr)],['Recall (sensibilidad)',pct(m.re)],['Especificidad',pct(m.sp)],['F1',isFinite(m.f1)?fmt(m.f1):'—'],['Youden J',fmt(m.j)]]);

const WIDGETS={
umbral:el=>ui(el,'Mové el umbral y mirá cómo cambian los errores',[['t','Umbral de decisión',.05,.95,.01,.5],['prev','Positivos reales (prevalencia)',.02,.5,.01,.2,x=>pct(x,0)]],v=>{
  const c=clf(v.t,v.prev),m=metrics(c),ym=Math.max(v.prev,1-v.prev)*npdf(0,0,CL.s)*1.08;
  const g=plot({x:[0,1],y:[0,ym],xt:[0,.25,.5,.75,1],xl:'Probabilidad que estima el modelo',h:250,w:420});
  g.area(x=>(1-v.prev)*npdf(x,CL.mn,CL.s),'a1',0,1).fn(x=>(1-v.prev)*npdf(x,CL.mn,CL.s),'l1').area(x=>v.prev*npdf(x,CL.mp,CL.s),'a2',0,1).fn(x=>v.prev*npdf(x,CL.mp,CL.s),'l2').v(v.t,'th','umbral '+fmt(v.t));
  const r=plot({x:[0,1],y:[0,1],xt:[0,.5,1],yt:[0,.5,1],xl:'FPR = 1 − especificidad',yl:'TPR = recall',h:250,w:300});
  r.path([[0,0],[1,1]],'lm').path(Array.from({length:99},(_,i)=>{return[1-Phi((1-i/98-CL.mn)/CL.s),1-Phi((1-i/98-CL.mp)/CL.s)]}),'l1').dot(c.fpr,c.tpr,'dk',6,'Umbral actual').text(.55,.42,'azar','start',0,0,'mu');
  const best=(CL.mn+CL.mp)/2;
  return `<div class="duo"><div>${legend([['s1','Negativos reales'],['s2','Positivos reales']])}${g.svg('Distribución de puntajes de negativos y positivos con el umbral')}</div><div>${r.svg('Curva ROC con el punto del umbral actual')}</div></div>
  <p style="font-size:.9rem;margin:.2rem 0">A la derecha del umbral el modelo predice <b>positivo</b>. Sobre 1.000 casos:</p>${cmHTML(c)}${metHTML(m)}
  <p class="verdict">${m.re<.5?'Con este umbral se escapan más de la mitad de los positivos (muchos FN).':m.pr<.5?'Detectás casi todo, pero más de la mitad de tus alertas son falsas alarmas (muchos FP).':'Equilibrio razonable entre omisiones y falsas alarmas.'} ${v.prev<=.08?`Con solo ${pct(v.prev,0)} de positivos, predecir siempre "negativo" daría ${pct(1-v.prev,0)} de accuracy sin detectar nada.`:''} El índice de Youden es máximo cerca de ${fmt(best)}.</p>`}),
